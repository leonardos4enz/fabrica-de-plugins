<!doctype html><html><head><meta charset="utf-8"><title>Worldcraft — presentación</title>
<!-- Spec 038: el logo y las franjas de la página de presentación de Worldcraft (SpigotMC, Modrinth, Hangar), con la misma
     técnica que los pósters de OmniEvents (020) y SkinStatues (024): un corte del mundo (cielo, pasto, tierra, piedra,
     pizarra, roca madre) en franjas de 1280 px que apiladas se leen como un solo póster. tests-e2e/presentacion.mjs
     (--plugin worldcraft) saca cada pieza (#id). Las fotos son las escenas de tests-e2e/worldcraft/presentacion.mjs; si
     una todavía no existe se dibuja un marcador gris con su nombre. Las cantidades de comandos salen del recuento de la
     038 (docs/worldcraft/presentacion/commands.md; PresentacionTest exige el 102). Texturas, logo e íconos dibujados
     aquí (ruido con semilla): nada de Mojang, WorldEdit ni FAWE. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@600;800;900&display=block">
<style>
:root{--ink:#1d2433;--gold:#ffcc33;--W:1280px}
html,body{margin:0;background:transparent;font-family:Nunito,"Segoe UI",sans-serif;color:#fff}
body{width:1600px}
.pieza{position:relative;overflow:hidden;box-sizing:border-box}
.strip{width:var(--W)}
.edge{position:absolute;left:0;right:0;bottom:0}
.center{text-align:center}
code{font-family:"Cascadia Code",Consolas,monospace}
#logo{width:512px;height:512px}
.sky{background:linear-gradient(#59c2ff,#b9ecff 85%)}
.cloud{position:absolute;background:#fff;height:24px;box-shadow:24px -24px 0 #fff,48px 0 0 #fff,72px -24px 0 #fff,96px 0 0 #fff}
.hdr{position:absolute;display:flex;align-items:center;gap:40px}
.hdr .t{font-family:"Press Start 2P";line-height:1;color:#fff;text-shadow:6px 6px 0 var(--ink)}
.hdr .xyz{font-weight:900;color:var(--ink);margin:18px 0 14px}
.hdr .xyz i{font-style:normal;background:var(--gold);padding:0 8px}
.hdr .sub{font-weight:800;color:#24405e;margin:0;line-height:1.35}
.pill{display:inline-block;font-family:"Press Start 2P";font-size:12px;background:var(--ink);color:var(--gold);padding:8px 12px;margin:14px 8px 0 0;box-shadow:3px 3px 0 #0005}
.sign,.ex h4,.card h5,.hdr .t,.pill,.slot h6,.slot b,.cap,.chat .p,.big b,.cmp th{font-weight:400 !important}
.sign{display:inline-block;font-family:"Press Start 2P";font-size:28px;color:var(--ink);background:#e8c37a;padding:10px 28px;border:5px solid var(--ink);box-shadow:inset -6px -6px 0 #c99a4a,inset 6px 6px 0 #f6dca0,6px 6px 0 #0006}
.lead{font-size:21px;font-weight:800;margin:14px 0 0;text-shadow:2px 2px 0 #0008}
.lead code{color:var(--gold)}
.pair{display:grid;gap:40px}
.ex h4{margin:0 0 6px;font-family:"Press Start 2P";font-size:19px;color:var(--gold);text-shadow:3px 3px 0 #0008}
.ex p{margin:4px 0 12px;font-size:17px;font-weight:800;text-shadow:2px 2px 0 #0008;min-height:46px}
.ex p code{color:var(--gold)}
.frame{position:relative;border:6px solid var(--ink);box-shadow:0 0 0 4px #8b6a3e,10px 10px 0 4px #0007;background:#000;line-height:0}
.frame img,.falta{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.falta{background:repeating-linear-gradient(45deg,#6b6f78 0 16px,#5f636c 16px 32px);display:flex;align-items:center;justify-content:center;line-height:1.4;font:400 16px "Press Start 2P";color:#e8edf5;text-shadow:2px 2px 0 #0008}
.cap{position:absolute;left:10px;top:10px;font:400 10px "Press Start 2P";background:#1d2433e6;color:var(--gold);padding:5px 8px;line-height:1}
.chat{background:#000a;padding:9px 14px;margin:0 0 10px;font-family:"Cascadia Code",Consolas,monospace;font-size:17px;line-height:1.3;color:#fff;border-left:5px solid var(--gold);white-space:nowrap}
.chat .p{font:400 10px "Press Start 2P";color:var(--gold);margin-right:10px;vertical-align:2px}
.chats{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;margin-top:24px}
/* comparación */
.cmp{width:100%;border-collapse:separate;border-spacing:0;background:#2b3140ee;border:5px solid var(--ink);box-shadow:inset 0 0 0 3px #4a5268,8px 8px 0 #0008;margin-top:30px}
.cmp th{font-family:"Press Start 2P";font-size:14px;padding:16px 10px;color:#fff;background:#1d2433;text-align:center}
.cmp th:first-child{text-align:left;padding-left:20px}
.cmp th.wc{color:var(--gold)}
.cmp td{padding:9px 10px;font-size:17px;font-weight:800;color:#d5dbea;border-top:2px solid #3a4258;text-align:center;line-height:1.25}
.cmp td:first-child{text-align:left;padding-left:20px;color:#fff}
.cmp td small{display:block;font-size:13.5px;font-weight:600;color:#a9b2c8}
.cmp td.wc{background:#ffcc3314}
.ok,.no,.half{display:inline-block;width:26px;height:26px;vertical-align:-6px}
/* comandos */
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:30px}
.big div{background:#2b3140ee;border:5px solid var(--ink);box-shadow:inset 0 0 0 3px #4a5268,8px 8px 0 #0008;padding:18px 20px;text-align:center}
.big b{display:block;font-family:"Press Start 2P";font-size:46px;color:var(--gold);text-shadow:4px 4px 0 #0008;line-height:1.2}
.big span{display:block;font-size:19px;font-weight:900;margin-top:8px}
.big small{display:block;font-size:15px;font-weight:600;color:#c7cfe2;margin-top:4px}
.groups{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px 22px;margin-top:26px}
.groups p{margin:0;font-size:15px;font-weight:600;color:#e3e8f3;line-height:1.35;text-shadow:1px 1px 0 #0008}
.groups b{color:var(--gold);font-weight:900}
.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:22px}
.card{background:#2b3140ee;border:5px solid var(--ink);box-shadow:inset 0 0 0 3px #4a5268,8px 8px 0 #0008;padding:18px 20px;display:flex;gap:16px;align-items:flex-start}
.card svg{width:64px;height:64px;flex:none}
.card h5{margin:0 0 9px;font-family:"Press Start 2P";font-size:14px;color:#fff;line-height:1.4}
.card p{margin:0;font-size:16px;font-weight:600;color:#d5dbea;line-height:1.38}
.card code{color:var(--gold);font-size:14.5px}
.hotbar{display:flex;justify-content:center;margin-top:36px}
.slot{width:270px;height:172px;background:#8b8b8b;border:6px solid var(--ink);box-shadow:inset 6px 6px 0 #5a5a5a,inset -6px -6px 0 #c6c6c6;position:relative;margin-left:-6px;padding:18px 18px;box-sizing:border-box}
.slot.sel{outline:6px solid #fff;z-index:1}
.slot b{font-family:"Press Start 2P";font-size:22px;position:absolute;right:12px;bottom:4px;color:#fff;text-shadow:3px 3px 0 #3f3f3f}
.slot h6{margin:0;font-family:"Press Start 2P";font-size:15px;color:#fff;text-shadow:2px 2px 0 #3f3f3f}
.slot p{margin:8px 0 0;font-size:16px;font-weight:800;color:#1d2433;line-height:1.3}
.slot code{font-size:14.5px}
.note{font-size:14px;font-weight:600;color:#c7cfe2;margin:14px 0 0;text-shadow:1px 1px 0 #0008}
</style></head><body><div id="todo"></div>
<script>
function azar(s){return()=>((s=(s*16807)%2147483647)/2147483647)}
function tex(cols,s,cell=8,n=16){const r=azar(s);let o=`<svg xmlns='http://www.w3.org/2000/svg' width='${n*cell}' height='${n*cell}' shape-rendering='crispEdges'>`;
 for(let y=0;y<n;y++)for(let x=0;x<n;x++)o+=`<rect x='${x*cell}' y='${y*cell}' width='${cell}' height='${cell}' fill='${cols[Math.floor(r()*cols.length)]}'/>`;
 return `url("data:image/svg+xml,${encodeURIComponent(o+'</svg>')}")`}
const T={grass:tex(['#5ccf4a','#52c241','#66d955','#4fb83e'],11),dirt:tex(['#7b5434','#86603d','#704b2d','#8e6744','#6a4529'],23),
 stone:tex(['#7d7f86','#74767d','#868890','#6c6e75','#8e9098'],37),deep:tex(['#3b3d47','#34363f','#43454f','#2e3038'],41),bed:tex(['#222','#3a3a3a','#555','#161616','#2c2c2c'],53)};
function edge(capa,s,ancho=1280,h=48,cell=16){const r=azar(s);let o='';for(let x=0;x<ancho;x+=cell){const k=cell*Math.floor(r()*3+1);o+=`<div data-tex="${capa}" style="position:absolute;left:${x}px;bottom:0;width:${cell}px;height:${k}px"></div>`}
 return `<div class="edge" style="height:${h}px">${o}</div>`}
const P=(x,y,c)=>`<rect x="${x}" y="${y}" width="1.04" height="1.04" fill="${c}"/>`;

// ——— logo: un bloque de pasto isométrico con un cuarto ya «editado» (sacado y vuelto a poner en oro, como una obra a
//     medio hacer), el contorno de la selección en puntos dorados y la varita. X derecha-adelante, Y izquierda-adelante, Z arriba.
function logoSvg(){
 const caras=[];
 let A,B,H,CX,CY;const pt=(X,Y,Z)=>[CX+(X-Y)*A,CY+(X+Y)*B-Z*H];
 const m=(o,u,v)=>`matrix(${u[0]},${u[1]},${v[0]},${v[1]},${o[0]},${o[1]})`;
 function prisma(x0,y0,x1,y1,z0,z1,izq,der,top,borde=true){
  const L=pt(x0,y1,z1),F=pt(x1,y1,z1),R=pt(x1,y0,z1),K=pt(x0,y0,z1),Lb=pt(x0,y1,z0),Fb=pt(x1,y1,z0),Rb=pt(x1,y0,z0);
  if(borde)caras.push(`<polygon points="${[K,R,Rb,Fb,Lb,L].map(p=>p.join(',')).join(' ')}" fill="#1d2433" stroke="#1d2433" stroke-width="16" stroke-linejoin="round" shape-rendering="geometricPrecision"/>`);
  caras.push(`<g transform="${m(L,[A,B],[0,H])}">${izq}</g>`);
  caras.push(`<g transform="${m(F,[A,-B],[0,H])}">${der}</g>`);
  caras.push(`<g transform="${m(K,[A,B],[-A,B])}">${top}</g>`);
 }
 const grid=(w,h,f)=>{let s='';for(let y=0;y<h;y++)for(let x=0;x<w;x++)s+=P(x,y,f(x,y));return s};
 const G=['#5ccf4a','#52c241','#66d955','#4fb83e'],G2=['#45a636','#3f9a31','#4cb03c'],D=['#7b5434','#86603d','#704b2d','#8e6744'],D2=['#5f3f25','#6a4729','#57391f'];
 const pick=(l,x,y,s)=>l[(x*7+y*13+s)%l.length];
 // lado de tierra con el borde de pasto arriba (fila 0 y unas gotas en la 1)
 const lado=(gr,dr,s)=>(x,y)=>(y===0||(y===1&&(x*5+s)%3===0))?pick(gr,x,y,s):pick(dr,x,y,s);
 const Y1='#ffcc33',Y2='#f2b519',Y3='#ffe27a',BR='#d99a12';
 const oro=(x,y)=>((x+y)%5===0)?Y3:((x*3+y)%7===0?Y2:Y1);
 // un bloque de pasto de 12×12×9 y, encima, un bloque de oro de 6×6×6 que se levanta de la selección (puntos dorados)
 A=13;B=A*0.5755;H=A*1.151;CX=246;
 const N=12,Z=9,g0=3,g1=9,gz=12,gh=6;
 CY=256-((2*N)*B+(gz+gh)*H)/2+(gz+gh)*H;
 prisma(0,0,N,N,0,Z,grid(N,Z,lado(G2,D2,3)),grid(N,Z,lado(G2,D2,5)),grid(N,N,(x,y)=>(x>=g0&&x<g1&&y>=g0&&y<g1)?pick(G2,x,y,4):pick(G,x,y,1)));
 // contorno de la selección: puntos dorados por el borde de la huella, sobre el pasto
 let dots='';const seg=(a,b,n)=>{for(let i=0;i<n;i++){const p=[a[0]+(b[0]-a[0])*i/n,a[1]+(b[1]-a[1])*i/n];dots+=`<rect x="${p[0]-4}" y="${p[1]-4}" width="8" height="8" fill="#ffe27a" stroke="#1d2433" stroke-width="2.5"/>`}};
 const c=[[g0,g0,Z],[g1,g0,Z],[g1,g1,Z],[g0,g1,Z]];
 for(let i=0;i<4;i++){const a=c[i],b=c[(i+1)%4];seg(pt(...a),pt(...b),5)}
 caras.push(dots);dots='';
 prisma(g0,g0,g1,g1,gz,gz+gh,grid(6,6,(x,y)=>y===0?Y3:oro(x,y)),grid(6,6,(x,y)=>y===0?Y2:(oro(x,y)===Y1?Y2:BR)),grid(6,6,oro));
 // la varita: una vara dorada en diagonal a la derecha, con la punta que brilla
 const w0=pt(N+1,-1.5,Z+13),w1=pt(N+1,4,Z+0.5);
 const vara=`<line x1="${w0[0]}" y1="${w0[1]}" x2="${w1[0]}" y2="${w1[1]}" stroke="#1d2433" stroke-width="22" stroke-linecap="square"/>`+
  `<line x1="${w0[0]}" y1="${w0[1]}" x2="${w1[0]}" y2="${w1[1]}" stroke="#d99a12" stroke-width="11" stroke-linecap="square"/>`+
  `<line x1="${w0[0]-2}" y1="${w0[1]}" x2="${w1[0]-2}" y2="${w1[1]}" stroke="#ffe27a" stroke-width="4"/>`+
  `<rect x="${w0[0]-14}" y="${w0[1]-14}" width="28" height="28" fill="#fff6c8" stroke="#1d2433" stroke-width="5"/>`+
  `<rect x="${w0[0]-34}" y="${w0[1]-4}" width="12" height="8" fill="#fff6c8"/><rect x="${w0[0]+22}" y="${w0[1]-4}" width="12" height="8" fill="#fff6c8"/>`+
  `<rect x="${w0[0]-4}" y="${w0[1]-34}" width="8" height="12" fill="#fff6c8"/>`;
 return `<svg viewBox="0 0 512 512" width="100%" height="100%" shape-rendering="crispEdges">${caras.join('')}${dots}${vara}</svg>`;
}
const LOGO=logoSvg();

const IMG='../../img/worldcraft/presentacion/escenas/';
function falta(img){const d=document.createElement('div');d.className='falta';d.dataset.falta=img.dataset.n;d.textContent='escenas/'+img.dataset.n;img.replaceWith(d)}
const foto=(n)=>`<img src="${IMG}${n}" data-n="${n}" onerror="falta(this)">`;
const marco=(n,cap)=>`<div class="frame">${foto(n)}${cap?`<span class="cap">${cap}</span>`:''}</div>`;
const ex=(t,p,n,cap)=>`<div class="ex"><h4>${t}</h4><p>${p}</p>${marco(n,cap)}</div>`;
const chat=(c,p='/')=>`<div class="chat"><span class="p">${p}</span>${c}</div>`;
// ——— marcas de la tabla: ✔ verde, ✘ roja, ~ amarilla, en píxeles ———
const marca=(k)=>{const px={ok:['......g','.....gg','g...gg.','gg.gg..','.ggg...','..g....'],no:['r....r','rr..rr','.rrrr.','.rrrr.','rr..rr','r....r'],half:['......','......','yyyyyy','yyyyyy','......','......']}[k];
 const col={g:'#3ee86b',r:'#ff5a5a',y:'#ffcc33'};let s='';px.forEach((f,y)=>[...f].forEach((ch,x)=>{if(col[ch])s+=P(x,y,col[ch])}));
 return `<svg class="${k}" viewBox="-0.5 -0.5 ${px[0].length+1} 7" shape-rendering="crispEdges">${s}</svg>`};
const fila=(t,n,wc,we,fa)=>`<tr><td>${t}${n?`<small>${n}</small>`:''}</td><td class="wc">${wc}</td><td>${we}</td><td>${fa}</td></tr>`;
const v=(k,txt='')=>marca(k)+(txt?`<small>${txt}</small>`:'');
function icono(dibujo){let s='';for(let y=0;y<8;y++)for(let x=0;x<8;x++)s+=P(x,y,(x*5+y*3)%4?'#7d7f86':'#6c6e75');
 for(const[x,y,c]of dibujo)s+=P(x,y,c);
 return `<svg viewBox="0 0 8 8" shape-rendering="crispEdges">${s}<rect x=".1" y=".1" width="7.8" height="7.8" fill="none" stroke="#1d2433" stroke-width=".3"/></svg>`}
const px=(filas,pal)=>filas.flatMap((f,y)=>[...f].map((ch,x)=>pal[ch]?[x,y,pal[ch]]:null).filter(Boolean));
const IC={
 lag:px(['........','.wwwwww.','.w....w.','.wggg.w.','.w....w.','.wwwwww.','........','........'],{w:'#e8edf5',g:'#3ee86b'}),
 preview:px(['........','..bbbb..','.b....b.','b..bb..b','b..bb..b','.b....b.','..bbbb..','........'],{b:'#5ef0e6'}),
 undo:px(['........','..r.....','.rrrrr..','..r...r.','......r.','.....r..','..rrr...','........'],{r:'#ff4040'}),
 words:px(['........','.yyy.yy.','........','.yy.yyy.','........','.yyyy.y.','........','........'],{y:'#ffcc33'}),
 limits:px(['........','..pppp..','.p....p.','.p....p.','pppppppp','pppp.ppp','pppppppp','........'],{p:'#b06cff'}),
 api:px(['........','.o....o.','o......o','o..oo..o','o..oo..o','o......o','.o....o.','........'],{o:'#ff9f3a'})};
const card=(ic,t,p)=>`<div class="card">${icono(IC[ic])}<div><h5>${t}</h5><p>${p}</p></div></div>`;
const nubes=(l)=>l.map(([x,y,w])=>`<div class="cloud" style="left:${x}px;top:${y}px;width:${w}px"></div>`).join('');

document.getElementById('todo').innerHTML=`
<div id="logo" class="pieza">${LOGO}</div>
<section id="franja-1" class="pieza strip sky" style="height:480px">${nubes([[640,40,96],[1080,100,72],[210,30,60]])}
 <div class="hdr" style="left:64px;top:74px"><div style="width:256px;height:256px">${LOGO}</div><div>
 <div class="t" style="font-size:60px">Worldcraft</div>
 <p class="xyz" style="font-size:31px">Edit the <i>world</i>. Never <i>freeze</i> the server.</p>
 <p class="sub" style="font-size:20px">WorldEdit's commands under <code>/wc</code>, run in small batches that never lag.<br>Preview every edit, undo it after a restart, and make a mountain with one word.</p>
 <span class="pill">Paper 1.21.4</span><span class="pill">102 commands</span><span class="pill">No WorldEdit needed</span><span class="pill">Reads .schem</span></div></div>
 ${edge('grass',5)}</section>
<section id="franja-2" class="pieza strip" data-tex="grass" style="padding:44px 60px 70px">
 <div class="center"><span class="sign">A mountain in one word</span><p class="lead">Snowy peaks, rock on the slopes, a foot that blends into the ground. Trees and builds are left alone.</p></div>
 <div class="chats">${chat('/wc mountain large')}${chat('/wc island large')}</div>
 <div style="margin-top:6px">${marco('terrain.png','shown first: [Build] [Another] [Cancel]')}</div></section>
<section id="franja-3" class="pieza strip" data-tex="dirt" style="padding-top:40px">
 <div style="position:absolute;left:0;right:0;top:0;height:40px" data-tex="grass">${edge('dirt',7,1280,40)}</div>
 <div style="padding:44px 60px 64px">
 <div class="center"><span class="sign">Shapes, pictures, formulas</span><p class="lead">The commands builders already know, with <code>--preview</code>: only you see it until <code>/wc confirm</code>.</p></div>
 <div class="pair" style="grid-template-columns:1fr 1fr;margin-top:30px">
 <div class="ex">${chat('/wc sphere orange_concrete 9')}${chat('/wc hcyl light_blue_concrete 8 16')}${marco('shapes.png')}</div>
 <div class="ex">${chat('/wc image logo.png 48')}${chat('/wc generate stone x^2+y^2+z^2<1')}${marco('image.png')}</div></div></div></section>
<section id="franja-4" class="pieza strip" data-tex="dirt" style="padding:20px 60px 110px">
 <div class="center"><span class="sign">Worldcraft vs WorldEdit vs FAWE</span></div>
 <table class="cmp"><tr><th></th><th class="wc">Worldcraft</th><th>WorldEdit</th><th>FAWE</th></tr>
 ${fila('Big edits never lag the server','',v('ok','8 ms per tick, shared'),v('no','main thread'),v('ok','async, server internals'))}
 ${fila('See the result before it changes','',v('ok','--preview, only you'),v('no'),v('no'))}
 ${fila('See the selection without a client mod','',v('ok','particles'),v('no','CUI mod'),v('no','CUI mod'))}

 ${fila('Patterns in plain words, "did you mean"','',v('ok','70% stone, 30% andesite'),v('half','70%stone,30%andesite'),v('half'))}
 ${fila('Shapes, brushes, tools, formulas, biomes, regen, snapshots','',v('ok'),v('ok'),v('ok'))}
 ${fila('WorldEdit .schem files (v1, v2, v3)','',v('ok','reads and writes'),v('ok'),v('ok'))}
 ${fila('Caves, ores, pictures (from FAWE)','',v('ok'),v('no'),v('ok'))}
 ${fila('Only the Paper API (no server internals)','',v('ok'),v('ok'),v('no'))}
 ${fila('Used by WorldGuard and PlotSquared','',v('no','keep WorldEdit for them'),v('ok'),v('ok'))}
 </table>
 <p class="note">Worldcraft 0.13.0, WorldEdit 7.3.19, FAWE 2.16.2 (November 2026). Worldcraft is not affiliated with EngineHub, IntellectualSites or Mojang.</p>
 ${edge('stone',13)}</section>
<section id="franja-5" class="pieza strip" data-tex="stone" style="padding:50px 60px 100px">
 <div class="center"><span class="sign">How many commands?</span></div>
 <div class="big">
  <div><b>102</b><span>commands under /wc</span><small>140 counted like WorldEdit counts its own</small></div>
  <div><b>129</b><span>of WorldEdit's 171</span><small>the same or better (75 %); 5 more in part</small></div>
  <div><b>142</b><span>of FAWE's 244</span><small>the same or better (58 %); 12 more in part</small></div></div>
