# Public docs (spec 017). Preview: zensical serve -f docs/site/mkdocs.yml (or mkdocs serve with mkdocs-material).
# The nav must list the same pages, in the same order, as pages/SUMMARY.md (DocsSiteTest checks it).
site_name: OmniEvents
site_description: "Script your Paper server in YAML: when something happens, if your conditions are true, run your actions."
repo_url: https://github.com/leonardos4enz/fabrica-de-plugins
edit_uri: edit/main/docs/site/pages/
docs_dir: pages
site_dir: site
exclude_docs: SUMMARY.md   # the GitBook index is not a page of its own

theme:
  logo: assets/logo.png
  favicon: assets/logo.png
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.instant
    - navigation.footer
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: deep orange
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: deep orange
      toggle:
        icon: material/brightness-4
        name: Light mode

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - OmniEvents: README.md
  - Getting started:
      - Why OmniEvents: omnievents/README.md
      - Installation: omnievents/installation.md
      - Your first rule: omnievents/first-rule.md
      - Examples: omnievents/examples.md
      - Build a minigame: omnievents/minigames.md
      - Migrating from ConditionalEvents: omnievents/migrating-from-conditionalevents.md
  - Writing rules:
      - Rule options: omnievents/rule-options.md
      - Triggers: omnievents/triggers.md
      - Conditions and expressions: omnievents/conditions.md
      - Actions: omnievents/actions.md
      - Variables: omnievents/variables.md
  - Reference:
      - Commands and permissions: omnievents/commands.md
      - More features:
          - Overview: omnievents/more-features.md
          - State rules: omnievents/features/state-rules.md
          - Rule tests: omnievents/features/rule-tests.md
          - Menus: omnievents/features/menus.md
          - Packs and templates: omnievents/features/packs-and-templates.md
          - Integrations: omnievents/features/integrations.md
          - Performance: omnievents/features/performance.md
          - Java API: omnievents/features/java-api.md
      - FAQ: omnievents/faq.md
