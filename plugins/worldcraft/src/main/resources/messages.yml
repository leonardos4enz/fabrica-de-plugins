# Worldcraft messages (MiniMessage). {name} values are filled in by the plugin and never read as tags.
prefix: "<gold>Worldcraft</gold> <dark_gray>»</dark_gray> "

no-permission: "{prefix}<red>You don't have permission to do that."
players-only: "{prefix}<red>Only a player can do that."
unknown-command: "{prefix}<red>Unknown command '{input}'{hint}. <gray>See /wc help"
usage: "{prefix}<red>Usage: <white>{usage}"
error: "{prefix}<red>{message}"
unknown-world: "{prefix}<red>There is no world called '{world}'."
unknown-direction: "{prefix}<red>'{input}' is not a direction{hint}: up, down, north, south, east or west."

help-header: "<gold>Worldcraft</gold> <gray>- /wc help <command> shows an example"
help-line: " <yellow>{usage}</yellow> <dark_gray>-</dark_gray> <gray>{text}"
help-footer: "<gray>Patterns: <white>stone</white>, <white>70% stone, 30% andesite</white>, <white>oak_stairs[facing=north]</white>, <white>$preset</white>. Masks: <white>dirt, grass_block</white>, <white>*_wool</white>, <white>#logs</white>, <white>!air</white>."
help-detail: "<yellow>{usage}</yellow>\n<gray>{text}\n<gray>Example: <white>{example}"

help:
  help: { usage: "/wc help [command]", text: "This list, or the details of one command.", example: "/wc help replace" }
  wand: { usage: "/wc wand", text: "Get the selection wand: left click a block for corner 1, right click for corner 2.", example: "/wc wand" }
  pos1: { usage: "/wc pos1 [x y z] [--world <w>]", text: "Corner 1 where you stand, or at those coordinates (~ is relative).", example: "/wc pos1 ~ ~-1 ~" }
  pos2: { usage: "/wc pos2 [x y z] [--world <w>]", text: "Corner 2 where you stand, or at those coordinates.", example: "/wc pos2 120 64 -30" }
  sel: { usage: "/wc sel [clear|show|hide]", text: "Size of your selection; clear it; show or hide its outline.", example: "/wc sel" }
  expand: { usage: "/wc expand <blocks> [direction] | vert", text: "Grow the selection where you look (or up, down, north...); vert = whole height.", example: "/wc expand 10 up" }
  contract: { usage: "/wc contract <blocks> [direction]", text: "Shrink the selection from that side.", example: "/wc contract 2 north" }
  shift: { usage: "/wc shift <blocks> [direction]", text: "Move the selection without changing its size.", example: "/wc shift 5 east" }
  set: { usage: "/wc set <pattern> [--preview]", text: "Fill the selection.", example: "/wc set 70% stone, 30% andesite" }
  replace: { usage: "/wc replace <mask> with <pattern> [--preview]", text: "Change only the blocks that match the mask.", example: "/wc replace dirt, grass_block with stone" }
  walls: { usage: "/wc walls <pattern> [--preview]", text: "The four side walls of the selection.", example: "/wc walls stone_bricks" }
  faces: { usage: "/wc faces <pattern> [--preview]", text: "Walls, floor and roof: a hollow box.", example: "/wc faces glass" }
  copy: { usage: "/wc copy", text: "Copy the selection, relative to where you stand.", example: "/wc copy" }
  cut: { usage: "/wc cut [--preview]", text: "Copy the selection and leave air.", example: "/wc cut" }
  paste: { usage: "/wc paste [--air] [--preview]", text: "Paste what you copied, relative to where you stand. Copied air is skipped unless --air.", example: "/wc paste --preview" }
  rotate: { usage: "/wc rotate <90|180|270|-90>", text: "Turn what you copied (clockwise seen from above), stairs and logs included.", example: "/wc rotate 90" }
  flip: { usage: "/wc flip [direction]", text: "Mirror what you copied towards where you look (or a direction).", example: "/wc flip up" }
  undo: { usage: "/wc undo [count] [--player <name>]", text: "Undo your last edits, also after a restart. Blocks someone changed since are left alone.", example: "/wc undo 3" }
  redo: { usage: "/wc redo [count] [--player <name>]", text: "Redo what you undid.", example: "/wc redo" }
  history: { usage: "/wc history [player]", text: "Your last edits (or another player's).", example: "/wc history" }
  confirm: { usage: "/wc confirm", text: "Run the edit that is waiting (a big one, or a preview).", example: "/wc confirm" }
  cancel: { usage: "/wc cancel", text: "Drop the waiting edit or its preview, or stop your running edits.", example: "/wc cancel" }
  jobs: { usage: "/wc jobs [cancel <id>]", text: "Running edits, their progress and the plugin's time per tick.", example: "/wc jobs" }
  limits: { usage: "/wc limits", text: "Your limits: biggest edit, edits at once, worlds, blocked blocks.", example: "/wc limits" }
  mountain: { usage: "/wc mountain [small|medium|large|huge|radius] [style] [key=value...] [--now]", text: "A mountain where you look, shown first. Options: height, peaks, roughness, ridges, sharpness, crater, seed, style, at=x,y,z, world.", example: "/wc mountain large style=volcano seed=42" }
  island: { usage: "/wc island [small|medium|large|huge|radius] [style] [key=value...] [--now]", text: "A floating island in front of you, shown first. Options: depth, relief, spikes, roots, trees, seed, style, at=x,y,z, world.", example: "/wc island large trees=5 spikes=1" }
  reroll: { usage: "/wc reroll", text: "The last mountain or island again with another seed (a new preview).", example: "/wc reroll" }
  brush: { usage: "/wc brush [raise|lower|smooth|flatten|erode|paint] [radius] [strength] [blocks] [style=..] [mask=..]", text: "Get or change the terrain brush: right click uses it where you look, left click picks the next mode.", example: "/wc brush smooth 6 0.5" }
  styles: { usage: "/wc styles", text: "The terrain styles in terrain.yml (which blocks go where).", example: "/wc styles" }
  schem: { usage: "/wc schem list [page] [filter] | load <name> | save <name> [--overwrite] | delete <name>", text: "WorldEdit's .schem files: load one into your clipboard (then /wc paste --preview), save your clipboard, list or delete them. WorldEdit's folder is read too.", example: "/wc schem load castles/tower" }
  reload: { usage: "/wc reload", text: "Reload config.yml, messages.yml, presets.yml and terrain.yml.", example: "/wc reload" }
  validate: { usage: "/wc validate", text: "List the problems in the configuration.", example: "/wc validate" }
  selftest: { usage: "/wc selftest", text: "Edit, undo, redo and undo a small box near spawn and check every step.", example: "/wc selftest" }
  # Spec 028: shapes, region operations, utilities and navigation (the names WorldEdit users know, without slashes).
  sphere: { usage: "/wc sphere <pattern> <radius>[,<y>,<z>] [--raised] [--preview]", text: "A sphere (or an ellipsoid) centered on your feet; --raised puts it on the ground.", example: "/wc sphere glass 8 --preview" }
  hsphere: { usage: "/wc hsphere <pattern> <radius>[,<y>,<z>] [--thickness <n>] [--raised] [--preview]", text: "A hollow sphere, one block thick unless --thickness.", example: "/wc hsphere stone 12 --raised" }
  cyl: { usage: "/wc cyl <pattern> <radius>[,<z>] [height] [--preview]", text: "A cylinder from your feet up (a negative height goes down).", example: "/wc cyl stone_bricks 5 10" }
  hcyl: { usage: "/wc hcyl <pattern> <radius>[,<z>] [height] [--thickness <n>] [--preview]", text: "A hollow cylinder: only the round wall, like WorldEdit's.", example: "/wc hcyl stone_bricks 6 12" }
  pyramid: { usage: "/wc pyramid <pattern> <size> [--preview]", text: "A pyramid on your feet: size blocks tall, 2×size−1 wide.", example: "/wc pyramid sandstone 10" }
  hpyramid: { usage: "/wc hpyramid <pattern> <size> [--thickness <n>] [--preview]", text: "A hollow pyramid.", example: "/wc hpyramid sandstone 12" }
  cone: { usage: "/wc cone <pattern> <radius> <height> [--preview]", text: "A cone on your feet (a negative height points down).", example: "/wc cone 70% stone, 30% andesite 6 14" }
  stack: { usage: "/wc stack [copies] [direction] [--air] [--select] [--preview]", text: "Repeat the selection where you look (or up, north...). Copied air is skipped unless --air; --select selects the last copy.", example: "/wc stack 5 up" }
  move: { usage: "/wc move [blocks] [direction] [pattern] [--select] [--preview]", text: "Move what is in the selection; what is left behind becomes air (or the pattern).", example: "/wc move 10 east" }
  overlay: { usage: "/wc overlay <pattern> [--preview]", text: "A layer on top of the ground in the selection (not on trees).", example: "/wc overlay snow" }
  naturalize: { usage: "/wc naturalize [--preview]", text: "Grass on top, 3 dirt below and stone under that, only on grass, dirt and stone.", example: "/wc naturalize" }
  smooth: { usage: "/wc smooth [passes] [--preview]", text: "Smooth the natural ground of the selection; trees and builds are left alone.", example: "/wc smooth 3 --preview" }
  hollow: { usage: "/wc hollow [thickness] [pattern] [--preview]", text: "Empty the inside of closed things in the selection, keeping a shell.", example: "/wc hollow 2" }
  center: { usage: "/wc center <pattern> [--preview]", text: "The middle block(s) of the selection.", example: "/wc center gold_block" }
  line: { usage: "/wc line <pattern> [thickness] [--preview]", text: "A line from corner 1 to corner 2.", example: "/wc line oak_planks 1" }
  drain: { usage: "/wc drain <radius> [--waterlogged] [--preview]", text: "Remove the water or lava nearest to you and what is connected to it; --waterlogged also dries stairs and slabs.", example: "/wc drain 20" }
  fixwater: { usage: "/wc fixwater <radius> [--preview]", text: "Turn the flowing water connected to the nearest water into still water.", example: "/wc fixwater 15" }
  fixlava: { usage: "/wc fixlava <radius> [--preview]", text: "Turn the flowing lava connected to the nearest lava into still lava.", example: "/wc fixlava 15" }
  fill: { usage: "/wc fill <pattern> <radius> [depth] [--preview]", text: "Fill the hole you stand in, from your feet down.", example: "/wc fill dirt 8" }
  removenear: { usage: "/wc removenear <mask> [radius] [--preview]", text: "Remove the matching blocks around you.", example: "/wc removenear #leaves 10" }
  replacenear: { usage: "/wc replacenear <radius> <mask> with <pattern> [--preview]", text: "Replace the matching blocks around you.", example: "/wc replacenear 10 dirt with grass_block" }
  removeabove: { usage: "/wc removeabove [size] [height] [--preview]", text: "Remove everything from your feet up (size 1 = your column).", example: "/wc removeabove 3 20" }
  removebelow: { usage: "/wc removebelow [size] [height] [--preview]", text: "Remove everything under your feet.", example: "/wc removebelow 1 5" }
  extinguish: { usage: "/wc extinguish [radius] [--preview]", text: "Put out the fire around you.", example: "/wc extinguish 20" }
  snow: { usage: "/wc snow [radius] [--preview]", text: "Snow on the ground around you; still water freezes.", example: "/wc snow 15" }
  thaw: { usage: "/wc thaw [radius] [--preview]", text: "Melt the snow and ice on top around you.", example: "/wc thaw 15" }
  green: { usage: "/wc green [radius] [--preview]", text: "Turn the dirt on top into grass around you.", example: "/wc green 10" }
  unstuck: { usage: "/wc unstuck", text: "Get out of the block you are stuck in.", example: "/wc unstuck" }
  ascend: { usage: "/wc ascend [floors]", text: "Go up to the next floor.", example: "/wc ascend" }
  descend: { usage: "/wc descend [floors]", text: "Go down to the next floor.", example: "/wc descend 2" }
  ceil: { usage: "/wc ceil [space]", text: "Go up right under the ceiling.", example: "/wc ceil" }
  thru: { usage: "/wc thru", text: "Go through the wall (or floor, or ceiling) you look at.", example: "/wc thru" }
  jumpto: { usage: "/wc jumpto", text: "Go to the block you look at.", example: "/wc jumpto" }
  up: { usage: "/wc up <blocks>", text: "Go straight up; if you cannot fly, a glass block is put under your feet (/wc undo removes it).", example: "/wc up 10" }

wand-given: "{prefix}<green>Here is your wand: <white>left click</white> a block for corner 1, <white>right click</white> for corner 2."
corner-set: "{prefix}Corner {which} at <white>{pos}</white>."
corner-set-size: "{prefix}Corner {which} at <white>{pos}</white> <dark_gray>·</dark_gray> selection <white>{size}</white> ({blocks} blocks)."
no-selection: "{prefix}<red>Select two corners first: /wc wand, or /wc pos1 and /wc pos2."
sel-info: "{prefix}Selection <white>{size}</white> ({blocks} blocks) in {world}, from {from} to {to}."
sel-cleared: "{prefix}Selection cleared."
sel-shown: "{prefix}The outline is shown while you hold the wand."
sel-hidden: "{prefix}The outline is hidden."
sel-changed: "{prefix}Selection now <white>{size}</white> ({blocks} blocks)."
sel-empty: "{prefix}<red>That would leave the selection empty."
sel-outside: "{prefix}<red>That is outside the world's height."

limit-world: "{prefix}<red>You may not edit in {world}."
limit-blocks: "{prefix}<red>That is {blocks} blocks; your limit is {max} (groups: {groups}). Select less, or ask for a bigger group."
limit-blocked: "{prefix}<red>You may not place {block} (blocked for your group: see /wc limits)."
limit-jobs: "{prefix}<red>You already have {max} edit(s) running or waiting. Wait, or /wc cancel."

confirm-needed: "{prefix}<yellow>This {kind} changes up to <white>{blocks}</white> blocks (about {time}). <white>/wc confirm</white> to go ahead, or run it again with <white>--preview</white> to see it first. It waits {seconds} s."
terrain-confirm-needed: "{prefix}<yellow>This {kind} changes up to <white>{blocks}</white> blocks (about {time}). <white>/wc confirm</white> to go ahead (without --now it shows a preview first). It waits {seconds} s."
preview-start: "{prefix}Preparing a preview of {kind} ({blocks} blocks): only you will see it."
preview-ready: "{prefix}<aqua>Preview ready: {shown} blocks change. Nothing changed yet. <white>/wc confirm</white> to do it, <white>/wc cancel</white> to drop it ({seconds} s)."
preview-partial: "{prefix}<aqua>Preview shows the first {shown} blocks of {blocks}. Nothing changed yet. <white>/wc confirm</white> to do it, <white>/wc cancel</white> to drop it ({seconds} s)."
nothing-to-confirm: "{prefix}<red>There is nothing waiting for confirmation."
pending-cancelled: "{prefix}Dropped: nothing was changed."
pending-expired: "{prefix}<gray>The edit waiting for confirmation expired: nothing was changed."
nothing-to-cancel: "{prefix}<red>You have nothing running or waiting."
jobs-cancelled: "{prefix}Stopped {count} edit(s): what was already done can be undone with /wc undo."

edit-start: "{prefix}Started {kind}: {blocks} blocks, about {time}."
edit-queued: "{prefix}{kind} is waiting for your previous edit to finish."
edit-done: "{prefix}<green>Done: {kind} changed {changed} blocks in {time}.</green> <gray>/wc undo to undo it (#{id})."
edit-cancelled: "{prefix}<yellow>{kind} stopped after {changed} blocks: /wc undo removes them."
progress: "<gold>{kind}</gold> <white>{percent}%</white> <gray>· {done} of {total} blocks"

copied: "{prefix}<green>Copied {size} ({blocks} blocks).</green> <gray>/wc paste puts it relative to where you stand."
copy-cancelled: "{prefix}<yellow>The copy stopped before the end: the clipboard did not change."
no-clipboard: "{prefix}<red>Your clipboard is empty: /wc copy first."
rotated: "{prefix}Clipboard turned {degrees}°: now {size}."
rotate-90: "{prefix}<red>Turn in steps of 90: 90, 180, 270 or -90."
flipped: "{prefix}Clipboard flipped {direction}."

undo-done: "{prefix}<green>Undone #{id} ({kind} {detail}): {changed} blocks back as they were."
redo-done: "{prefix}<green>Redone #{id} ({kind} {detail}): {changed} blocks."
undo-skipped: "{prefix}<yellow>{skipped} block(s) were left alone: someone changed them after the edit."
undo-cancelled: "{prefix}<yellow>Undo of #{id} stopped before the end: run it again to finish."
undo-busy: "{prefix}<red>Wait for your running edit to finish (or /wc cancel) before undoing."
undo-no-world: "{prefix}<red>Edit #{id} was in {world}, which is not loaded."
nothing-to-undo: "{prefix}<red>{player} has nothing to undo."
nothing-to-redo: "{prefix}<red>{player} has nothing to redo."
no-history: "{prefix}<red>No history for {player}{hint}."
history-empty: "{prefix}{player} has no edits in the history."
history-header: "{prefix}Last edits of {player} ({count}):"
history-line: " <white>#{id}</white> <gray>{when}</gray> {kind} <gray>{detail}</gray> · {changed} blocks in {world} <dark_gray>({state})"

jobs-header: "{prefix}{count} edit(s). Plugin time per tick: last {last} ms, max {max} ms (budget {budget} ms)."
jobs-last: "{prefix}Last edit: {kind}, {changed} blocks, longest tick {longest} ms (budget {budget} ms)."
jobs-line: " <white>#{id}</white> {kind} by {owner}: {percent}% <dark_gray>({state})"
job-cancelled: "{prefix}Edit #{id} stopped."
no-such-job: "{prefix}<red>There is no running edit #{id}."
limits: "{prefix}Groups: <white>{groups}</white> · biggest edit {max} blocks · {jobs} at once · worlds: {worlds} · blocked: {blocked}"

reloaded: "{prefix}Reloaded: {errors} error(s), {warnings} warning(s). /wc validate lists them."
validate-ok: "{prefix}<green>Configuration OK."
validate-error: "<red>✘ {issue}"
validate-warning: "<yellow>• {issue}"
selftest-start: "{prefix}Selftest in a 6×6×6 box at {box}..."
selftest-ok: "{prefix}<green>Selftest passed: set {changed} blocks, undo, redo and undo; the terrain is as before."
selftest-failed: "{prefix}<red>Selftest failed: {reason}"

# Terrain (/wc mountain, /wc island, /wc brush)
terrain-reading: "{prefix}<gray>Reading the ground for your {kind}..."
terrain-busy: "{prefix}<red>Wait a moment: your last terrain is still being prepared."
terrain-needs-at: "{prefix}<red>From the console, say where: /wc {kind} at=x,y,z [world=name]"
terrain-too-big: "{prefix}<red>That is about {blocks} blocks; your limit is {max} (groups: {groups}). Try a smaller size."
terrain-nothing: "{prefix}<yellow>Nothing to place: the {kind} would only cover blocks that are already there (or builds, which are left alone)."
terrain-error: "{prefix}<red>Something went wrong preparing the terrain (see the server log)."
terrain-scan-cancelled: "{prefix}<yellow>Stopped reading the ground: nothing changed."
terrain-preview-ready: "{prefix}<green>Here is your {kind}</green> <gray>({blocks} blocks, only you see it) <dark_gray>{note}"
terrain-preview-partial: "{prefix}<yellow>Here is part of your {kind}</yellow> <gray>({blocks} blocks; the preview shows the first part) <dark_gray>{note}"
terrain-buttons: " <click:run_command:'/wc confirm'><hover:show_text:'Build it (/wc confirm)'><green><b>[Build]</b></green></hover></click>  <click:run_command:'/wc reroll'><hover:show_text:'Another one with a new seed (/wc reroll)'><aqua><b>[Another]</b></aqua></hover></click>  <click:run_command:'/wc cancel'><hover:show_text:'Drop it (/wc cancel)'><red><b>[Cancel]</b></red></hover></click>"
terrain-buttons-no-reroll: " <click:run_command:'/wc confirm'><hover:show_text:'Build it (/wc confirm)'><green><b>[Build]</b></green></hover></click>  <click:run_command:'/wc cancel'><hover:show_text:'Drop it (/wc cancel)'><red><b>[Cancel]</b></red></hover></click>"
nothing-to-reroll: "{prefix}<red>Make a mountain or an island first: /wc mountain or /wc island."
brush-given: "{prefix}<green>Here is your terrain brush</green> <gray>({brush}). <white>Right click</white> where you look to use it, <white>left click</white> for the next mode."
brush-updated: "{prefix}Brush set to <white>{brush}</white>."
brush-mode: "<gold>Brush</gold> <white>{brush}</white>"
styles-header: "{prefix}{count} terrain styles <gray>(use them with style=name; edit them in terrain.yml)"
styles-line: " <yellow>{name}</yellow> <dark_gray>-</dark_gray> <gray>{description}"

# Schematics (/wc schem)
schem-unknown: "{prefix}<red>Unknown schem command '{input}'{hint}. <gray>Usage: <white>{usage}"
schem-busy: "{prefix}<red>Wait a moment: your last schematic is still being read or written."
schem-loading: "{prefix}<gray>Loading {name}..."
schem-saving: "{prefix}<gray>Saving {name}..."
schem-loaded: "{prefix}<green>Loaded {name}{folder} (Sponge v{version}): {size} ({blocks} blocks) is now your clipboard."
schem-loaded-next: " <gray>/wc paste --preview to see it where you stand, /wc rotate and /wc flip to turn it."
schem-note-tiles: " <gray>• {count} chest(s), container(s) or sign(s) keep their contents."
schem-note-kept: " <yellow>• {count} other block data ({kinds}) is not pasted, but is kept if you save it again."
schem-note-unknown: " <yellow>• {count} block(s) this server does not know were loaded as air: {kinds}."
schem-note-adjusted: " <gray>• {count} block state(s) lost a property this server does not have."
schem-note-renamed: " <gray>• {count} block(s) renamed since that version of the game were translated."
schem-note-entities: " <yellow>• {count} entity(ies) in the file are not loaded (only blocks)."
schem-note-bad: " <yellow>• {count} block data entry(ies) in the file were damaged and skipped."
schem-note-newer: " <yellow>• The file is from a newer version of the game (data version {version}; this server: {server}): some blocks may be missing."
schem-note-tiles-failed: "{prefix}<yellow>{count} block data entry(ies) could not be saved (see the server log)."
schem-saved: "{prefix}<green>Saved {name}: {size} ({blocks} blocks), {kb} KB.</green> <gray>WorldEdit can load it too."
schem-save-cancelled: "{prefix}<yellow>Saving {name} was stopped: no file was written."
schem-exists: "{prefix}<red>{name} already exists. <gray>Pick another name, or add --overwrite to replace it."
schem-overwrite-permission: "{prefix}<red>Replacing a schematic needs the permission to delete them."
schem-not-found: "{prefix}<red>There is no schematic called {name}{hint}. <gray>/wc schem list shows them."
schem-bad: "{prefix}<red>Could not load {name}: {reason}. Your clipboard did not change."
schem-io: "{prefix}<red>Could not read or write {name}: {reason}"
schem-error: "{prefix}<red>Something went wrong with {name} (see the server log)."
schem-list-empty: "{prefix}No schematics yet. <gray>/wc copy, then /wc schem save <name>."
schem-list-none: "{prefix}No schematic matches '{filter}'."
schem-list-header: "{prefix}{count} schematic(s), page {page} of {pages} <gray>(click a name to load it)"
schem-list-line: " <click:suggest_command:'/wc schem load {name}'><hover:show_text:'/wc schem load {name}'><white>{name}</white></hover></click> <dark_gray>{folder}</dark_gray><gray>{kb} KB · {date}"
schem-list-more: " <gray>/wc schem list {next} for more"
schem-deleted: "{prefix}Deleted {name}. <gray>It waits {days} day(s) in schematics/.trash/ in case you want it back."
schem-read-only: "{prefix}<red>{name} is in the {folder} folder: Worldcraft only reads there, never deletes."

# Spec 028: shapes, region operations, utilities and navigation.
read-cancelled: "{prefix}<yellow>Reading the blocks for {kind} stopped before the end: nothing changed."
needs-place: "{prefix}<red>From the console, say where: --at <x,y,z> [--world <w>]."
radius-too-big: "{prefix}<red>{radius} is too big: the biggest is {max} (shapes.max_radius / utilities.max_radius in config.yml)."
compute-error: "{prefix}<red>Something went wrong calculating that (see the server log)."
nothing-found: "{prefix}<yellow>Nothing to do for {kind} there."
smooth-nothing: "{prefix}<yellow>The ground in the selection is already smooth (or there is no natural ground)."
nav-moved: "{prefix}Whoosh! <gray>{pos}"
nav-no-floor-above: "{prefix}<red>There is no free floor above you."
nav-no-floor-below: "{prefix}<red>There is no free floor below you."
nav-no-spot: "{prefix}<red>There is no free spot there."
nav-no-ceiling: "{prefix}<red>There is no ceiling above you."
nav-blocked: "{prefix}<red>Something is in the way up there."
nav-no-wall: "{prefix}<red>There is no wall to go through where you look (up to 32 blocks)."
nav-no-target: "{prefix}<red>Look at a block (up to {reach} blocks away)."
