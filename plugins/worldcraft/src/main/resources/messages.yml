# Worldcraft messages (MiniMessage). {name} values are filled in by the plugin and never read as tags.
prefix: "<gold>Worldcraft</gold> <dark_gray>»</dark_gray> "

no-permission: "{prefix}<red>You don't have permission to do that."
players-only: "{prefix}<red>Only a player can do that."
unknown-command: "{prefix}<red>Unknown command '{input}'{hint}. <gray>See /wc help"
usage: "{prefix}<red>Usage: <white>{usage}"
error: "{prefix}<red>{message}"
unknown-world: "{prefix}<red>There is no world called '{world}'."
unknown-direction: "{prefix}<red>'{input}' is not a direction{hint}: up, down, north, south, east or west."

help-header: "<gold>Worldcraft</gold> <gray>- /wc help <command> shows an example"
help-line: " <yellow>{usage}</yellow> <dark_gray>-</dark_gray> <gray>{text}"
help-footer: "<gray>Patterns: <white>stone</white>, <white>70% stone, 30% andesite</white>, <white>oak_stairs[facing=north]</white>, <white>$preset</white>. Masks: <white>dirt, grass_block</white>, <white>*_wool</white>, <white>#logs</white>, <white>!air</white>. Formulas: mask <white>=y>=64</white>, pattern <white>=(x+z)%2 -> white_wool, black_wool</white>. Colors: <white>#color[red]</white>, <white>#darken</white>, <white>#lighten</white>. Every command also works like in WorldEdit: <white>//set</white>, <white>//copy -e</white>, <white>/brush</white>."
help-detail: "<yellow>{usage}</yellow>\n<gray>{text}\n<gray>Example: <white>{example}"

help:
  help: { usage: "/wc help [command]", text: "This list, or the details of one command.", example: "/wc help replace" }
  wand: { usage: "/wc wand", text: "Get the selection wand: left click a block for corner 1, right click for corner 2.", example: "/wc wand" }
  pos1: { usage: "/wc pos1 [x y z] [--world <w>]", text: "Corner 1 (or the first point or center of other shapes, like a left click) where you stand, or at those coordinates (~ is relative).", example: "/wc pos1 ~ ~-1 ~" }
  pos2: { usage: "/wc pos2 [x y z] [--world <w>]", text: "Corner 2 (or another point or the radius, like a right click) where you stand, or at those coordinates.", example: "/wc pos2 120 64 -30" }
  sel: { usage: "/wc sel [cuboid|extend|poly|ellipsoid|sphere|cyl|convex|magic|clear|show|hide]", text: "Your selection and its size; choose its shape (the wand says how to mark it); clear it; show or hide its outline.", example: "/wc sel cyl" }
  expand: { usage: "/wc expand <blocks> [direction] | vert", text: "Grow the selection where you look (or up, down, north...); vert = whole height.", example: "/wc expand 10 up" }
  contract: { usage: "/wc contract <blocks> [direction]", text: "Shrink the selection from that side.", example: "/wc contract 2 north" }
  shift: { usage: "/wc shift <blocks> [direction]", text: "Move the selection without changing its size.", example: "/wc shift 5 east" }
  set: { usage: "/wc set <pattern> [--preview]", text: "Fill the selection.", example: "/wc set 70% stone, 30% andesite" }
  replace: { usage: "/wc replace <mask> with <pattern> [--preview]", text: "Change only the blocks that match the mask.", example: "/wc replace dirt, grass_block with stone" }
  walls: { usage: "/wc walls <pattern> [--preview]", text: "The four side walls of the selection.", example: "/wc walls stone_bricks" }
  faces: { usage: "/wc faces <pattern> [--preview]", text: "Walls, floor and roof: a hollow box.", example: "/wc faces glass" }
  copy: { usage: "/wc copy [--entities] [--biomes] [--mask <mask>]", text: "Copy the selection, relative to where you stand. --entities also copies the armor stands, item frames, paintings and mobs inside; --biomes also copies the biomes. With --mask, what does not match is copied as air.", example: "/wc copy --entities" }
  cut: { usage: "/wc cut [--entities] [--biomes] [--mask <mask>] [--preview]", text: "Copy the selection and leave air. --entities also takes the entities inside; --biomes copies the biomes (the place keeps its own). With --mask, only what matches is cut.", example: "/wc cut --entities" }
  paste: { usage: "/wc paste [--air] [--origin] [--select] [--only-select] [--no-entities] [--remove-entities] [--biomes] [--preview]", text: "Paste what you copied, relative to where you stand (--origin: where it was copied). Copied air is skipped unless --air. Copied entities come too (--no-entities leaves them); --remove-entities first removes the entities already there. --biomes also pastes the copied biomes. --select selects what you pasted; --only-select only selects where it would go.", example: "/wc paste --preview" }
  rotate: { usage: "/wc rotate <90|180|270|-90>", text: "Turn what you copied (clockwise seen from above), stairs and logs included.", example: "/wc rotate 90" }
  flip: { usage: "/wc flip [direction]", text: "Mirror what you copied towards where you look (or a direction).", example: "/wc flip up" }
  undo: { usage: "/wc undo [count] [--player <name>]", text: "Undo your last edits, also after a restart. Blocks someone changed since are left alone.", example: "/wc undo 3" }
  redo: { usage: "/wc redo [count] [--player <name>]", text: "Redo what you undid.", example: "/wc redo" }
  history: { usage: "/wc history [player]", text: "Your last edits (or another player's).", example: "/wc history" }
  confirm: { usage: "/wc confirm", text: "Run the edit that is waiting (a big one, or a preview).", example: "/wc confirm" }
  cancel: { usage: "/wc cancel", text: "Drop the waiting edit or its preview, or stop your running edits.", example: "/wc cancel" }
  jobs: { usage: "/wc jobs [cancel <id>]", text: "Running edits, their progress and the plugin's time per tick.", example: "/wc jobs" }
  limits: { usage: "/wc limits", text: "Your limits: biggest edit, edits at once, worlds, blocked blocks.", example: "/wc limits" }
  mountain: { usage: "/wc mountain [small|medium|large|huge|radius] [style] [key=value...] [--now]", text: "A mountain where you look, shown first. Options: height, peaks, roughness, ridges, sharpness, crater, seed, style, at=x,y,z, world.", example: "/wc mountain large style=volcano seed=42" }
  island: { usage: "/wc island [small|medium|large|huge|radius] [style] [key=value...] [--now]", text: "A floating island in front of you, shown first. Options: depth, relief, spikes, roots, trees, seed, style, at=x,y,z, world.", example: "/wc island large trees=5 spikes=1" }
  reroll: { usage: "/wc reroll", text: "The last mountain or island again with another seed (a new preview).", example: "/wc reroll" }
  brush: { usage: "/wc brush <sphere|cyl|set|clipboard|splatter|scatter|rock|gravity|extinguish|butcher|forest|deform|snow|snowsmooth|biome|morph|dilate|heightmap|feature|apply|line|spline|surfacespline|sweep|catenary|circle|pull|recursive|shatter|stencil|image|height|populateschematic|copypaste|savebrush|listbrush|loadbrush|none> ... | [raise|lower|smooth|flatten|erode|paint] [radius] [strength]", text: "Turn the item in your hand into a brush (only that item; an empty hand gets one): right click uses it where you look. Building brushes: sphere <blocks> [radius] [--hollow], cyl <blocks> [radius] [height], set <cube|sphere|cyl> [radius] <blocks>, clipboard [--air] [--origin], splatter <blocks> [radius] [decay], scatter <blocks> [radius] [points] [distance] [--overlay], rock <blocks> [radius] [sphericity] [frequency] [amplitude], gravity [radius] [--height], extinguish [radius], butcher [radius] [--animals...], forest [tree] [radius] [density], deform [radius] [formula] [--raw] [--offset], snow [radius] [--stack], snowsmooth [radius] [passes], biome [radius] <biome>, morph [radius] [erode faces] [erode passes] [dilate faces] [dilate passes], dilate [radius] [faces] [passes], heightmap <image> [radius] [height] [--erase] [--flatten], feature <feature> [radius] [density], apply [sphere|cube|cyl] [radius] item <item>, paint [shape] [radius] [density] item <item>. From FAWE (0.16.0): line <blocks> [thickness] [--shell] [--select] [--flat] (two clicks), spline <blocks> [thickness] and surfacespline (click points, click the last one again to draw), sweep [copies] (your clipboard along the curve), catenary <blocks> [length] [thickness] [--facing] (a hanging rope between two clicks), circle <blocks> [radius] [--fill], pull [radius] [passes], recursive <blocks> [radius], shatter <blocks> [radius] [pieces], stencil <blocks> [radius] [image], image <image> [radius] [--alpha] [--fade], height [radius] [image] [scale], populateschematic <mask> <schematic|folder> [radius] [density] [--rotate], copypaste [radius] [--random-rotate|--auto-rotate] (left click copies, right click pastes); savebrush <name> [--global], listbrush [page] and loadbrush <name> keep brushes; mask=.. and radius=.. change the brush in your hand; none makes it a normal item again. Terrain brushes (raise, lower, smooth, flatten, erode, paint) only move natural ground; left click picks the next mode.", example: "/wc brush sphere stone 4" }
  tool: { usage: "/wc tool <repl|floodfill|info|cycler|deltree|farwand|lrbuild|navwand|tree|stacker|inspect|featureplacer|structureplacer|none> ...", text: "Turn the item in your hand into a one-click tool: repl <blocks> (right click places, left click picks), floodfill <blocks> [range], info, cycler (right click: next value, left click: next property), deltree (removes a floating tree), farwand (corners from far away), lrbuild <left> <right> (build from far away; air removes), navwand (left: jump to, right: through walls), tree [type] (right click grows a tree on the block), stacker [range] [mask] (repeats the block towards the face you click; left click, the other way), inspect (who changed the block you click with Worldcraft, and when), featureplacer <feature> and structureplacer <template> (right click puts one on the block). none makes it a normal item again.", example: "/wc tool repl oak_planks" }
  superpickaxe: { usage: "/wc superpickaxe [single|area <radius>|recursive <radius>|off]", text: "Break blocks instantly with any pickaxe (left click): single, area (the same block in a cube) or recursive (the same block, connected). Nothing is dropped and /wc undo brings them back. /wc sp alone turns it on or off.", example: "/wc sp area 2" }
  sp: { usage: "/wc sp [single|area <radius>|recursive <radius>|off]", text: "Short for /wc superpickaxe.", example: "/wc sp" }
  styles: { usage: "/wc styles", text: "The terrain styles in terrain.yml (which blocks go where).", example: "/wc styles" }
  schem: { usage: "/wc schem list [page] [filter] | load <name> | save <name> [--overwrite] | delete <name> | import [--overwrite] | formats | loadall <names or folder/> | move <folder>", text: "WorldEdit's .schem files (also /wc schematic): load one into your clipboard (then /wc paste --preview), save your clipboard, list or delete them. WorldEdit's folder is read too; import copies WorldEdit's and FAWE's into Worldcraft's folder; formats says what it reads and writes; loadall loads several (or a folder) and paste picks one at random each time; move puts the last one you loaded in another folder.", example: "/wc schem load castles/tower" }
  reload: { usage: "/wc reload", text: "Reload config.yml, messages.yml, presets.yml and terrain.yml.", example: "/wc reload" }
  validate: { usage: "/wc validate", text: "List the problems in the configuration.", example: "/wc validate" }
  selftest: { usage: "/wc selftest", text: "Edit, undo, redo and undo a small box near spawn and check every step.", example: "/wc selftest" }
  # Spec 028: shapes, region operations, utilities and navigation (the names WorldEdit users know, without slashes).
  sphere: { usage: "/wc sphere <pattern> <radius>[,<y>,<z>] [--raised] [--preview]", text: "A sphere (or an ellipsoid) centered on your feet; --raised puts it on the ground.", example: "/wc sphere glass 8 --preview" }
  hsphere: { usage: "/wc hsphere <pattern> <radius>[,<y>,<z>] [--thickness <n>] [--raised] [--preview]", text: "A hollow sphere, one block thick unless --thickness.", example: "/wc hsphere stone 12 --raised" }
  cyl: { usage: "/wc cyl <pattern> <radius>[,<z>] [height] [--preview]", text: "A cylinder from your feet up (a negative height goes down).", example: "/wc cyl stone_bricks 5 10" }
  hcyl: { usage: "/wc hcyl <pattern> <radius>[,<z>] [height] [--thickness <n>] [--preview]", text: "A hollow cylinder: only the round wall, like WorldEdit's.", example: "/wc hcyl stone_bricks 6 12" }
  pyramid: { usage: "/wc pyramid <pattern> <size> [--preview]", text: "A pyramid on your feet: size blocks tall, 2×size−1 wide.", example: "/wc pyramid sandstone 10" }
  hpyramid: { usage: "/wc hpyramid <pattern> <size> [--thickness <n>] [--preview]", text: "A hollow pyramid.", example: "/wc hpyramid sandstone 12" }
  cone: { usage: "/wc cone <pattern> <radius> <height> [--preview]", text: "A cone on your feet (a negative height points down).", example: "/wc cone 70% stone, 30% andesite 6 14" }
  stack: { usage: "/wc stack [copies] [direction] [--air] [--entities] [--select] [--preview]", text: "Repeat the selection where you look (or up, north...). Copied air is skipped unless --air; --entities repeats the entities too; --select selects the last copy.", example: "/wc stack 5 up" }
  move: { usage: "/wc move [blocks] [direction] [pattern] [--entities] [--select] [--preview]", text: "Move what is in the selection; what is left behind becomes air (or the pattern). --entities moves the entities with it.", example: "/wc move 10 east --entities" }
  butcher: { usage: "/wc butcher [radius] [--pets] [--npcs] [--golems] [--animals] [--ambient] [--water] [--named] [--armorstands] [--friendly]", text: "Remove the hostile mobs around you (nothing is dropped; /wc undo brings them back). Pets, villagers, golems, animals, bats, fish, named mobs and armor stands are spared unless you add their option; --friendly adds all the friendly ones. Never players.", example: "/wc butcher 30" }
  remove: { usage: "/wc remove <type> [radius]", text: "Remove entities of one type around you: items, arrows, projectiles, xp, boats, minecarts, tnt, falling, paintings, itemframes, armorstands, or an entity like cow. /wc undo brings them back.", example: "/wc remove items 20" }
  overlay: { usage: "/wc overlay <pattern> [--preview]", text: "A layer on top of the ground in the selection (not on trees).", example: "/wc overlay snow" }
  naturalize: { usage: "/wc naturalize [--preview]", text: "Grass on top, 3 dirt below and stone under that, only on grass, dirt and stone.", example: "/wc naturalize" }
  smooth: { usage: "/wc smooth [passes] [--preview]", text: "Smooth the natural ground of the selection; trees and builds are left alone.", example: "/wc smooth 3 --preview" }
  hollow: { usage: "/wc hollow [thickness] [pattern] [--preview]", text: "Empty the inside of closed things in the selection, keeping a shell.", example: "/wc hollow 2" }
  center: { usage: "/wc center <pattern> [--preview]", text: "The middle block(s) of the selection.", example: "/wc center gold_block" }
  line: { usage: "/wc line <pattern> [thickness] [--preview]", text: "A line from corner 1 to corner 2.", example: "/wc line oak_planks 1" }
  drain: { usage: "/wc drain <radius> [--waterlogged] [--preview]", text: "Remove the water or lava nearest to you and what is connected to it; --waterlogged also dries stairs and slabs.", example: "/wc drain 20" }
  fixwater: { usage: "/wc fixwater <radius> [--preview]", text: "Turn the flowing water connected to the nearest water into still water.", example: "/wc fixwater 15" }
  fixlava: { usage: "/wc fixlava <radius> [--preview]", text: "Turn the flowing lava connected to the nearest lava into still lava.", example: "/wc fixlava 15" }
  fill: { usage: "/wc fill <pattern> <radius> [depth] [--preview]", text: "Fill the hole you stand in, from your feet down.", example: "/wc fill dirt 8" }
  removenear: { usage: "/wc removenear <mask> [radius] [--preview]", text: "Remove the matching blocks around you.", example: "/wc removenear #leaves 10" }
  replacenear: { usage: "/wc replacenear <radius> <mask> with <pattern> [--preview]", text: "Replace the matching blocks around you.", example: "/wc replacenear 10 dirt with grass_block" }
  removeabove: { usage: "/wc removeabove [size] [height] [--preview]", text: "Remove everything from your feet up (size 1 = your column).", example: "/wc removeabove 3 20" }
  removebelow: { usage: "/wc removebelow [size] [height] [--preview]", text: "Remove everything under your feet.", example: "/wc removebelow 1 5" }
  extinguish: { usage: "/wc extinguish [radius] [--preview]", text: "Put out the fire around you.", example: "/wc extinguish 20" }
  snow: { usage: "/wc snow [radius] [--preview]", text: "Snow on the ground around you; still water freezes.", example: "/wc snow 15" }
  thaw: { usage: "/wc thaw [radius] [--preview]", text: "Melt the snow and ice on top around you.", example: "/wc thaw 15" }
  green: { usage: "/wc green [radius] [--preview]", text: "Turn the dirt on top into grass around you.", example: "/wc green 10" }
  unstuck: { usage: "/wc unstuck", text: "Get out of the block you are stuck in.", example: "/wc unstuck" }
  ascend: { usage: "/wc ascend [floors]", text: "Go up to the next floor.", example: "/wc ascend" }
  descend: { usage: "/wc descend [floors]", text: "Go down to the next floor.", example: "/wc descend 2" }
  ceil: { usage: "/wc ceil [space]", text: "Go up right under the ceiling.", example: "/wc ceil" }
  thru: { usage: "/wc thru", text: "Go through the wall (or floor, or ceiling) you look at.", example: "/wc thru" }
  jumpto: { usage: "/wc jumpto", text: "Go to the block you look at.", example: "/wc jumpto" }
  up: { usage: "/wc up <blocks>", text: "Go straight up with a glass block under your feet as a floor, also in creative (/wc undo removes it).", example: "/wc up 10" }
  # Spec 029: selección, información y máscara global
  hpos1: { usage: "/wc hpos1", text: "Corner 1 at the block you look at, far away too.", example: "/wc hpos1" }
  hpos2: { usage: "/wc hpos2", text: "Corner 2 at the block you look at, far away too.", example: "/wc hpos2" }
  chunk: { usage: "/wc chunk [--expand] [--chunk-coords <x> <z>]", text: "Select the whole chunk you stand in, from bottom to top; --expand adds it to your selection.", example: "/wc chunk --expand" }
  outset: { usage: "/wc outset <blocks> [--horizontal] [--vertical]", text: "Grow the selection to every side.", example: "/wc outset 2 --horizontal" }
  inset: { usage: "/wc inset <blocks> [--horizontal] [--vertical]", text: "Shrink the selection from every side.", example: "/wc inset 1" }
  trim: { usage: "/wc trim [mask]", text: "Shrink the selection to the blocks that match (everything but air if no mask).", example: "/wc trim !air" }
  count: { usage: "/wc count <mask>", text: "Count the blocks in the selection that match. Masks can look around: 'stone above grass_block', 'exposed', '30% chance'.", example: "/wc count diamond_ore" }
  distr: { usage: "/wc distr [--states] [--clipboard]", text: "The 10 most common blocks in the selection (or your clipboard) with their share.", example: "/wc distr" }
  clearclipboard: { usage: "/wc clearclipboard", text: "Empty your clipboard.", example: "/wc clearclipboard" }
  clearhistory: { usage: "/wc clearhistory", text: "Delete your undo history from the disk (asks /wc confirm first).", example: "/wc clearhistory" }
  biomelist: { usage: "/wc biomelist [page] [filter]", text: "List the server's biomes (data pack biomes too), 15 per page.", example: "/wc biomelist 2" }
  biomeinfo: { usage: "/wc biomeinfo [--target | --here]", text: "The biomes in your selection with their %; --target (-t) the biome of the block you look at, --here (-p) the one where you stand.", example: "/wc biomeinfo --target" }
  setbiome: { usage: "/wc setbiome <biome> [--here]", text: "Change the biome of your selection (any shape). The game keeps one biome per 4×4×4 cell: every cell your selection touches changes. --here (-p): only the cell where you stand. Undo brings the old biomes back.", example: "/wc setbiome cherry_grove" }
  forest: { usage: "/wc forest [tree] [density] [--preview]", text: "The game's trees on the grass and dirt of your selection that have air above, density % per column (default oak, 5). Trees: oak, birch, spruce, big_oak, jungle, dark_oak, cherry, mangrove, pale_oak, crimson_fungus, red_mushroom, chorus, random...", example: "/wc forest birch 10 --preview" }
  forestgen: { usage: "/wc forestgen [size] [tree] [density] [--preview]", text: "A forest around you, size blocks each way (default 10, at most nature.max_size).", example: "/wc forestgen 15 spruce 8" }
  flora: { usage: "/wc flora [density] [--preview]", text: "Grass and flowers on the grass of your selection, dead bushes and some cactus on sand (density %, default 10; the plants are in nature.flora_grass and flora_sand).", example: "/wc flora 20" }
  pumpkins: { usage: "/wc pumpkins [size] [density] [--preview]", text: "Pumpkin patches with leaves on the grass around you (density %, default 2; 0.02 works too, like WorldEdit).", example: "/wc pumpkins 12 5" }
  structure: { usage: "/wc structure list [filter] [page] | load <name> [--palette <n>]", text: "The game's structure templates (igloo, village houses, shipwrecks, ruins...) and those of data packs: load one into your clipboard, then /wc paste (rotate, flip, preview and undo work). Chests keep their loot table.", example: "/wc structure load igloo/top" }
  gmask: { usage: "/wc gmask [mask | off]", text: "A mask for all your edits until 'off' (or until you leave): only matching blocks change.", example: "/wc gmask !#logs" }
  generate: { usage: "/wc generate <pattern> <formula> [--hollow] [--raw|--offset|--center] [--preview]", text: "Fill your selection where the formula is true, like WorldEdit's //generate (alias gen): x, y and z go from -1 to 1 in the selection (0 in the middle). --hollow (-h): only the shell. --raw (-r): world coordinates; --offset (-o): from your feet; --center (-c): from the middle, not scaled. The pattern is one word (use a preset for a mix with spaces).", example: "/wc generate stone x^2+y^2+z^2<1" }
  generatebiome: { usage: "/wc generatebiome <biome> <formula> [--hollow] [--raw|--offset|--center]", text: "Change the biome of the 4×4×4 cells of your selection where the formula is true in the middle of the cell (alias genbiome); x, y, z like /wc generate. Undo brings the old biomes back.", example: "/wc generatebiome desert x<0" }
  deform: { usage: "/wc deform <formula> [--raw|--offset|--center] [--preview]", text: "Like WorldEdit's //deform: for every block of your selection the formula changes x, y and z, and the block takes what was there (y-=0.2 lifts what is below; x*=2 stretches it). x, y, z like /wc generate. Everything is read first; chests keep their items.", example: "/wc deform y-=0.2" }
  calc: { usage: "/wc calc <formula>", text: "Work out a formula (aliases calculate, eval): numbers, + - * / % ^, sqrt, sin, min, max, pi... and your own variables (a=3; a*2).", example: "/wc calc 2^10 + sqrt(16)" }
  timeout: { usage: "/wc timeout [milliseconds | default]", text: "How long a formula, /wc caves or /wc ore may calculate in one of your commands (generate, deform, generatebiome, calc, caves, ore, ores). Without a number it says the current one.", example: "/wc timeout 5000" }
  caves: { usage: "/wc caves [size] [frequency] [--rooms] [--preview]", text: "Cut a network of tunnels through your selection, like the game's caves since 1.18 (FAWE's //caves): size is how wide (1-10, default 3), frequency how many (1-100, default 40); --rooms adds big rooms. Only rock, dirt and gravel are cut (caves.mask); below caves.lava_y they fill with lava. Different every time.", example: "/wc caves 4 60 --rooms" }
  ore: { usage: "/wc ore <mask> <pattern> [size] [frequency] [rarity] [min y] [max y] [--preview]", text: "Spread veins of the pattern in your selection where the mask is, like FAWE's //ore: frequency tries per chunk (16×16), each with rarity % to come out, of about size blocks, between the two heights (default: 8 blocks, 10 tries, 100%, the whole selection).", example: "/wc ore stone gold_ore 9 4 100 -64 32" }
  ores: { usage: "/wc ores [mask] [--preview]", text: "Spread the game's ores in your selection (coal, iron, copper, gold, redstone, lapis, diamond, emerald) with their sizes, amounts and heights (the ores list in config.yml), in the rock of the mask (default: stone, deepslate, andesite, diorite, granite, tuff). In deepslate and tuff the deepslate version goes.", example: "/wc ores" }
  image: { usage: "/wc image <file | link | list> [size] [--floor|--wall] [--preview]", text: "Build a picture with blocks (alias img), each pixel the block of the closest color; transparent pixels are left as they are. Looking down it lies on the ground ahead of you; otherwise it stands like a wall 2 blocks in front of you. size is the long side in blocks. Files go in plugins/Worldcraft/images; links only if the server turns them on (images.links).", example: "/wc image logo.png 64" }
  regen: { usage: "/wc regen [seed | random] [biome] [--biomes] [--preview]", text: "Put your selection back the way the world generator made it (WorldEdit's //regen): the blocks, and the loot chests of structures. With the world's seed by default; random (-r) another seed, or write one; a biome makes everything with that biome. --biomes (-b) puts the biomes back too. Mobs are not touched. The terrain is made in a temporary world that is deleted afterwards.", example: "/wc regen --biomes" }
  snapshot: { usage: "/wc snapshot list [page] | use <name | latest> | sel <number> | before <date> | after <date>", text: "Choose one of the server's backups for /wc restore (alias snap). The backups are in the folder snapshots.folder of config.yml. A date is 2026-11-02 or 2026-11-02 14:30 (server time). Without choosing, /wc restore uses the newest.", example: "/wc snapshot before 2026-11-02 14:30" }
  restore: { usage: "/wc restore [backup] [--biomes] [--preview]", text: "Put your selection back the way it was in a backup (WorldEdit's //restore): the blocks, chests and signs with what they had, and other block data; --biomes (-b) the biomes too. What the backup does not have is left as it is.", example: "/wc restore --preview" }

  # Spec 040: what was missing from WorldEdit 7.3.19
  curve: { usage: "/wc curve <pattern> [thickness] [--hollow] [--preview]", text: "A smooth curve through the points of a convex or poly selection, in the order you clicked them (like WorldEdit's //curve). --hollow (-h) leaves only the shell of a thick curve.", example: "/wc curve stone_bricks 1" }
  snowsmooth: { usage: "/wc snowsmooth [passes] [--mask <mask>] [--preview]", text: "Smooth the snow of your selection: snow layers count as eighths of a block, so hills of snow become slopes. Only snow layers change, never the ground. --mask (-m): which blocks count as ground.", example: "/wc snowsmooth 3" }
  fillr: { usage: "/wc fillr <pattern> <radius> [depth] [--preview]", text: "Fill the hole you stand in, sideways and down, inside a sphere (like WorldEdit's //fillr; /wc fill uses a cylinder).", example: "/wc fillr water 10" }
  feature: { usage: "/wc feature <feature> [--preview]", text: "One of the game's features (a mossy rock, an amethyst geode, a huge mushroom, a patch of flowers...) at your feet (or where /wc placement says), with preview and undo. Ore features are refused: use /wc ore.", example: "/wc feature amethyst_geode" }
  update: { usage: "/wc update [--preview]", text: "Fix the shape of the blocks of your selection to match their neighbors (fences, walls, panes, stairs, redstone that don't connect after a paste), with undo.", example: "/wc update" }
  placement: { usage: "/wc placement [player|pos1|pos2|center] [x,y,z]", text: "Where shapes (sphere, cyl...), the fixes around you (fill, drain, snow...) and features go: your feet, a corner or the middle of your selection, plus an offset. Without words, it says the current one.", example: "/wc placement pos1 0,1,0" }
  toggleplace: { usage: "/wc toggleplace", text: "Switch between placing at your feet and at corner 1 (like WorldEdit's //toggleplace).", example: "/wc toggleplace" }
  toggleeditwand: { usage: "/wc toggleeditwand", text: "Make the wand a normal axe until you use this again (or back).", example: "/wc toggleeditwand" }
  range: { usage: "/wc range <blocks>", text: "How far the brush or tool in your hand reaches where you look (up to tools.range).", example: "/wc range 60" }
  tracemask: { usage: "/wc tracemask <mask> | off", text: "The brush or tool in your hand aims at the first block that matches the mask (water, !air, #leaves...) instead of the first solid one.", example: "/wc tracemask water" }
  chunkinfo: { usage: "/wc chunkinfo", text: "The chunk you stand in, its region file and where you are inside it.", example: "/wc chunkinfo" }
  listchunks: { usage: "/wc listchunks [page]", text: "The chunks your selection touches, with their region files.", example: "/wc listchunks" }
  searchitem: { usage: "/wc searchitem <text> [page] [--blocks|--items]", text: "Find items and blocks by name (-b only blocks, -i only items).", example: "/wc searchitem stone brick" }
  version: { usage: "/wc version", text: "The versions of Worldcraft, the server and Java, and whether the game's features work here.", example: "/wc version" }
  report: { usage: "/wc report", text: "Write a report for a bug (versions, worlds, plugins, configuration, running edits) to plugins/Worldcraft/reports/. It is never uploaded anywhere.", example: "/wc report" }
  trace: { usage: "/wc trace [on|off]", text: "After each of your edits, say how many blocks it looked at, changed, found already like that and left out (mask, shape), and how long it took.", example: "/wc trace on" }
  tz: { usage: "/wc tz [zone]", text: "Your time zone for the dates of the backups (/wc snapshot list, before, after): Europe/Madrid, America/Bogota, UTC-5, or server.", example: "/wc tz America/Bogota" }
  # Spec 041: what FastAsyncWorldEdit adds.
  gtexture: { usage: "/wc gtexture [mask | #clipboard | off]", text: "The blocks the color patterns (#color[red], #darken...) and the image brush pick from, until 'off': the ones of the color table that match the mask, or the ones in your clipboard.", example: "/wc gtexture *_wool" }
  gsmask: { usage: "/wc gsmask [mask | off]", text: "A source mask for all your edits until 'off': a block the edit would place and that doesn't match is left out (!air: pasting doesn't put the air).", example: "/wc gsmask !air" }
  gtransform: { usage: "/wc gtransform [transform | off]", text: "All your edits put their blocks moved: #offset[x][y][z], #rotate[90] (around the middle of the edit), #flip[x], #spread[n] (each block moved up to n at random), #scale[n] (each block becomes an n×n×n cube); several, with spaces.", example: "/wc gtransform #offset[0][10][0]" }
  smask: { usage: "/wc smask <mask> | off", text: "A source mask for the brush in your hand only (like /wc gsmask).", example: "/wc smask !air" }
  transform: { usage: "/wc transform <transform> | off", text: "A transform for the brush in your hand only (like /wc gtransform).", example: "/wc transform #spread[3]" }
  target: { usage: "/wc target [block|forward|height|face]", text: "Where the brush in your hand lands: the first block (block), the point /wc range blocks ahead even in the air (forward), the block under your aim at the height of your feet (height), or the block in front of the face you look at (face). Alone, the next one.", example: "/wc target face" }
  targetoffset: { usage: "/wc targetoffset <blocks>", text: "Move where the brush in your hand lands that many blocks out of the face you look at (negative: into it), up to tools.max_target_offset.", example: "/wc targetoffset 2" }
  scroll: { usage: "/wc scroll <none|size|range|targetoffset|target|mask|pattern|clipboard> [values...]", text: "With the brush in your hand, turning the mouse wheel (moving to the next hotbar slot) changes that instead of the item: the radius, the reach, the offset, the target mode, a mask or pattern from your list, or a schematic from /wc schem loadall. The number keys still change the item.", example: "/wc scroll pattern stone dirt glass" }
  primary: { usage: "/wc primary <brush...>", text: "The right-click brush of the item in your hand (like /wc brush), keeping its left-click brush.", example: "/wc primary sphere stone 3" }
  secondary: { usage: "/wc secondary <brush...>", text: "The left-click brush of the brush in your hand: one item, two brushes.", example: "/wc secondary sphere air 3" }
  place: { usage: "/wc place [--air] [--origin] [--select] [--only-select] [--no-entities] [--remove-entities] [--biomes] [--preview]", text: "Paste your clipboard without the rotation or flip you gave it (like FAWE's //place); the options are the ones of /wc paste.", example: "/wc place --origin" }
  fall: { usage: "/wc fall [fill] [--inside] [--preview]", text: "The blocks of your selection fall until they rest on something; what they leave becomes the fill (air if you write none). --inside (-m): they don't fall below the selection. Chests and other blocks with data stay.", example: "/wc fall" }
  fixblocks: { usage: "/wc fixblocks [--preview]", text: "Like /wc update: fix the shape of fences, walls, panes and stairs of your selection to their neighbors (FAWE's //fixblocks, //fixconnect).", example: "/wc fixblocks" }
  nbtinfo: { usage: "/wc nbtinfo", text: "The data (NBT) of the block you look at: a chest's items, a sign's text, a spawner's mob.", example: "/wc nbtinfo" }
  wea: { usage: "/wc wea [on|off]", text: "Turn on or off going past protection plugins: an edit another plugin would stop still goes ahead, and you are told whose. Needs worldcraft.bypass.", example: "/wc wea" }
  wer: { usage: "/wc wer", text: "Select the area where you may build here, as your protection plugin says (it has to support Worldcraft's API).", example: "/wc wer" }
  registry: { usage: "/wc registry <block|item|biome|entity|enchantment|effect|sound|structure|particle|potion|game_event|feature> [text] [page]", text: "Search the server's registries by name.", example: "/wc registry biome forest" }
  fixlighting: { usage: "/wc fixlighting", text: "Have the game work out the light again in the chunks of your selection (or the one you stand in): for dark spots or light left behind. Blocks don't change.", example: "/wc fixlighting" }
  debugpaste: { usage: "/wc debugpaste", text: "Like /wc report, with the end of the server log and Worldcraft's files, to plugins/Worldcraft/reports/. It is never uploaded anywhere.", example: "/wc debugpaste" }

