name: Worldcraft
version: '${version}'
main: dev.leo.worldcraft.Worldcraft
api-version: '1.21'
author: Leo
description: Fast, safe world editing - edits that never lag the server, previews, undo that survives restarts.
commands:
  worldcraft:
    description: Select, edit, preview, undo and copy parts of the world.
    usage: /worldcraft help
    aliases: [wc]
permissions:
  worldcraft.use:
    description: Use the wand and every edit command on your own selection and history.
    default: op
  worldcraft.moderate:
    description: See and undo other players' edits, and see or cancel everybody's running edits.
    default: op
  worldcraft.admin:
    description: Reload, validate and selftest.
    default: op
  worldcraft.schematic:
    description: List and load schematics (/wc schem list|load). Saving needs worldcraft.schematic.save.
    default: op
  worldcraft.schematic.save:
    description: Save your clipboard as a schematic and import WorldEdit's and FAWE's (/wc schem save|import).
    default: op
  worldcraft.schematic.delete:
    description: Delete schematics and replace them with save --overwrite.
    default: op
  worldcraft.butcher:
    description: Remove the hostile mobs around you (/wc butcher); undo brings them back.
    default: op
  worldcraft.remove:
    description: Remove entities of one type around you (/wc remove items, arrows, cow...); undo brings them back.
    default: op
  worldcraft.navigate:
    description: Move around while building (/wc ascend, descend, ceil, thru, jumpto, unstuck, up).
    default: op
  worldcraft.image.link:
    description: Build a picture from a link (/wc image https://...), when images.links is on. The server downloads it.
    default: op
  worldcraft.superpickaxe:
    description: Break blocks instantly with any pickaxe (/wc superpickaxe, /wc sp); nothing is dropped and undo brings them back.
    default: op
