name: Worldcraft
version: '${version}'
main: dev.leo.worldcraft.Worldcraft
api-version: '1.21'
author: Leo
description: Fast, safe world editing - edits that never lag the server, previews, undo that survives restarts.
commands:
  worldcraft:
    description: Select, edit, preview, undo and copy parts of the world.
    usage: /worldcraft help
    aliases: [wc]
permissions:
  worldcraft.use:
    description: Use the wand and every edit command on your own selection and history.
    default: op
  worldcraft.moderate:
    description: See and undo other players' edits, and see or cancel everybody's running edits.
    default: op
  worldcraft.admin:
    description: Reload, validate and selftest.
    default: op
  worldcraft.schematic:
    description: List, load and save schematics (/wc schem list|load|save).
    default: op
  worldcraft.schematic.delete:
    description: Delete schematics and replace them with save --overwrite.
    default: op
  worldcraft.navigate:
    description: Move around while building (/wc ascend, descend, ceil, thru, jumpto, unstuck, up).
    default: op
