# Worldcraft - fast, safe world editing for Paper.
# Every value is checked when the plugin loads: /wc validate lists the problems, /wc reload applies changes.

wand:
  # The item /wc wand gives. Only that wand selects: an ordinary item of the same type stays an ordinary item.
  item: minecraft:golden_axe

selection:
  show: true              # draw the selection box with particles, only for you, while you hold the wand
  show_every_ticks: 10    # how often the box is redrawn (20 ticks = 1 second)
  max_particles: 400      # per drawing: big boxes get fewer particles per edge, never more than this
  max_points: 64          # the most points of a poly or convex selection (3..256)
  magic_radius: 16        # how far a magic selection looks for connected blocks around your click (1..64)

performance:
  # The time budget of the whole plugin per server tick, shared by everybody's edits.
  # 50 ms is a full tick: 8 ms leaves the server more than 80% of every tick, even during a huge edit.
  max_ms_per_tick: 8
  max_blocks_per_tick: 200000

confirm:
  # Edits bigger than above_blocks wait for /wc confirm (they say how many blocks and how long first). 0 = always ask.
  # enabled: false runs every edit right away (--preview still waits for /wc confirm).
  enabled: true
  above_blocks: 50000
  expire_seconds: 120     # an edit waiting for confirmation (and its preview) is dropped after this

preview:
  # --preview shows the result to you only, with fake blocks, before anything changes. Bigger edits show the first part.
  max_blocks: 50000

history:
  # Undo history is saved to disk (plugins/Worldcraft/history/): it survives restarts.
  max_per_player: 30
  keep_days: 7            # 0 = keep until max_per_player pushes them out

# Limits per group. "default" applies to everyone with worldcraft.use; give another group with the permission
# worldcraft.limit.<group> (for example worldcraft.limit.builder). With several groups, the most generous value wins.
#   max_blocks:     the biggest edit (blocks it may change)
#   max_jobs:       edits running or waiting at the same time
#   worlds:         where the group may edit ("*" = everywhere)
#   blocked_blocks: blocks the group may not place (mask syntax); [] = none
#   max_entities:   entities one edit may create or remove (copy --entities, paste, butcher, remove...); 0 = none
#   blocked_entities: entity types the group may not create (also checked on what rides them); [] = none
limits:
  default:
    max_blocks: 50000
    max_jobs: 2
    worlds: ["*"]
    blocked_blocks: [bedrock, barrier, command_block, chain_command_block, repeating_command_block, structure_block,
                     jigsaw, end_portal_frame, end_portal, end_gateway, nether_portal, spawner, light]
    max_entities: 200
    blocked_entities: [command_block_minecart, spawner_minecart, tnt, tnt_minecart, falling_block, wither, ender_dragon]
  builder:
    max_blocks: 1000000
    max_jobs: 3
    max_entities: 2000
  admin:
    max_blocks: 10000000
    max_jobs: 5
    blocked_blocks: []
    max_entities: 20000
    blocked_entities: []

# Terrain tools (/wc mountain, /wc island, /wc brush). Styles and sizes are in terrain.yml.
terrain:
  preview_first: true     # mountains and islands show a preview first and wait for /wc confirm (or the [Build] button)
  reach: 200              # how far the crosshair looks for the ground where a mountain goes
  max_radius: 160         # the biggest mountain or island radius
  # What counts as natural ground (mask syntax). Brushes only move this; houses and other builds are left alone.
  ground: "#dirt, #sand, #base_stone_overworld, #base_stone_nether, #terracotta, #nylium, gravel, clay, sandstone, red_sandstone, calcite, dripstone_block, end_stone, snow_block, powder_snow, ice, packed_ice, blue_ice, magma_block, obsidian, #coal_ores, #iron_ores, #copper_ores, #gold_ores, #redstone_ores, #lapis_ores, #diamond_ores, #emerald_ores"
  # What may be covered or cleared: air, plants, water.
  cover: "air, #replaceable, #flowers, #saplings"
  # What a mountain may bury (a brush never touches it).
  buryable: "#logs, #leaves"
  brush:
    item: minecraft:golden_shovel
    max_radius: 16        # 1..64
    range: 200            # how far a brush reaches
    show: true            # a circle of particles where the brush would land, only for you

# Schematics (/wc schem save|load|list|delete): .schem files in the Sponge format that WorldEdit and FAWE use.
# Yours are in plugins/Worldcraft/schematics/; deleted ones wait in schematics/.trash/ for trash_days.
schematics:
  max_file_kb: 10240      # the biggest .schem that is loaded (10 MB)
  max_blocks: 5000000     # the biggest schematic (width × height × length) that is loaded; pasting still uses your limits
  trash_days: 7           # 0 = empty the trash at every start
  # Read-only folders (relative to the server folder): WorldEdit's and FAWE's schematics are loaded from where they are.
  # Worldcraft never writes or deletes there.
  extra_folders: [plugins/WorldEdit/schematics, plugins/FastAsyncWorldEdit/schematics]

# Shapes (/wc sphere, cyl, pyramid, cone...): the biggest radius. Your group's block limit still applies.
shapes:
  max_radius: 200
# Around the player (/wc drain, fixwater, fill, removenear, snow...): the biggest radius.
utilities:
  max_radius: 64
# Entities (/wc butcher, /wc remove): the radius when none is given, and the biggest one.
entities:
  butcher_radius: 32
  max_radius: 128

# Building brushes and one-click tools (/wc brush sphere, /wc tool repl...) and the super pickaxe (/wc sp).
# /wc brush and /wc tool turn the item in your hand into the brush (only that item); with an empty hand you get one.
tools:
  item: minecraft:blaze_rod        # what you get with an empty hand
  navwand_item: minecraft:compass  # what /wc tool navwand gives with an empty hand
  range: 200                       # how far a brush or tool reaches where you look (1..512)
  show: true                       # a circle of particles where the brush would land, only for you
  brush_max_radius: 16             # the biggest brush radius (0..64)
  max_range: 32                    # the biggest floodfill range (1..64)
  deltree_range: 24                # how far deltree looks around a floating tree (4..64)
  superpickaxe_max_radius: 5       # the biggest area or recursive super pickaxe (1..16)
  tree_blocks: "#logs, #leaves, vine, cocoa, bee_nest, mangrove_roots"   # what deltree removes (mask syntax)
  # Blocks the super pickaxe never breaks (mask syntax).
  never_break: "bedrock, barrier, end_portal_frame, end_portal, end_gateway, nether_portal, command_block, chain_command_block, repeating_command_block, structure_block, jigsaw"

# Trees, plants and pumpkins (/wc forest, forestgen, flora, pumpkins, /wc tool tree, /wc brush forest).
# The trees are the game's own (the same that grow from a sapling) and go through the editor: preview, limits and undo.
nature:
  max_trees: 300          # trees in one edit at most (1..5000)
  max_size: 32            # the biggest size of /wc forestgen and /wc pumpkins (1..64)
  soil: "grass_block, dirt, podzol, coarse_dirt, rooted_dirt, mycelium, moss_block, mud"   # where a tree grows (mask syntax)
  # What /wc flora plants (pattern syntax): on grass and dirt, and on sand.
  flora_grass: "80% short_grass, 5% dandelion, 5% poppy, 4% cornflower, 3% oxeye_daisy, 3% azure_bluet"
  flora_sand: "90% dead_bush, 10% cactus"

# Formulas (/wc generate, deform, generatebiome, calc, "=formula" masks and patterns, /wc brush deform).
# A formula is worked out away from the server thread and cut when it takes too long; what it changes goes through the editor.
formulas:
  timeout_ms: 2000        # how long one command's formula may work, by default (each player: /wc timeout) (1..max_timeout_ms)
  max_timeout_ms: 10000   # the most /wc timeout can set (100..60000)
  max_steps: 100000       # loop rounds (while, for, do) in one evaluation (1000..10000000)
  max_length: 1000        # characters in one formula (32..10000)
  megabuf_size: 65536     # cells of megabuf() (0..10000000)
