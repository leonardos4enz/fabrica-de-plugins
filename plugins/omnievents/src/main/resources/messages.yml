# Mensajes de OmniEvents (MiniMessage). {prefix} se reemplaza por el prefijo.
prefix: "<dark_gray>[<gradient:#f7b733:#fc4a1a>Omni</gradient>]</dark_gray>"
no-permission: "{prefix} <red>No tienes permiso para esto."
unknown-subcommand: "{prefix} <red>Subcomando desconocido <white>{sub}</white>. Usa <yellow>/omni help</yellow>."
error: "{prefix} <red>{message}"
command-disabled: "{prefix} <red>Este comando está desactivado."
reload-done: "{prefix} <green>Recargado en {ms} ms: <white>{rules}</white> reglas, <red>{errors}</red> errores, <yellow>{warnings}</yellow> avisos."
validate-ok: "{prefix} <green>Todo en orden: 0 errores, <yellow>{warnings}</yellow> avisos."
validate-errors: "{prefix} <red>{errors} errores</red> y <yellow>{warnings} avisos</yellow>. Las reglas con errores no se cargan."
list-empty: "{prefix} <gray>No hay reglas que coincidan."
rule-enabled: "{prefix} <green>Regla <white>{rule}</white> activada."
rule-disabled: "{prefix} <yellow>Regla <white>{rule}</white> desactivada."
toggle-note: "<gray>  El cambio dura hasta el próximo reload; para dejarlo fijo, edita enabled en su archivo."
debug-on: "{prefix} <green>Depurando <white>{rule}</white>. Usa <yellow>/omni debug off</yellow> para parar."
debug-off: "{prefix} <gray>Depuración apagada."
run-done: "{prefix} <green>Regla <white>{rule}</white> ejecutada para <white>{player}</white>."
run-not-passed: "{prefix} <yellow>La regla <white>{rule}</white> no corrió sus acciones para <white>{player}</white>. Mira por qué con <yellow>/omni check {rule} {player}</yellow>."
cpu-on: "{prefix} <green>Perfilador encendido: mide 1 de cada {n} disparos. Mira el resultado con <yellow>/omni cpu</yellow>."
cpu-off: "{prefix} <gray>Perfilador apagado (lo medido se conserva hasta <yellow>/omni cpu reset</yellow>)."
cpu-reset: "{prefix} <gray>Perfilador reiniciado."
cpu-disabled: "{prefix} <gray>El perfilador está apagado. Enciéndelo con <yellow>/omni cpu on</yellow>."
export-done: "{prefix} <green>{traces} trazas guardadas en <white>{file}</white>. Revísalas antes de compartirlas: llevan nombres y mensajes de jugadores."
export-empty: "{prefix} <gray>No hay trazas guardadas. Primero depura una regla con <yellow>/omni debug</yellow> o simúlala con <yellow>/omni run … --simular</yellow>."
export-busy: "{prefix} <gray>Ya se está guardando una traza; espera un momento."
schema-done: "{prefix} <green>Esquema y referencia escritos en <white>{schema}</white> y <white>{reference}</white>. Para el autocompletado en VS Code, pon al inicio de un archivo de <white>rules/</white>: <yellow># yaml-language-server: $schema=../omnievents.schema.json</yellow> (en subcarpetas, agrega ../)."
schema-busy: "{prefix} <gray>Ya se está escribiendo el esquema; espera un momento."
debug-status: "{prefix} <gray>Depuración: <white>{rule}</white>"
call-done: "{prefix} <green>Regla <white>{rule}</white> ejecutada."
var-set: "{prefix} <green>{target}.{name}</green> <gray>=</gray> <white>{value}</white>"
var-deleted: "{prefix} <yellow>{target}.{name}</yellow> <gray>borrada."
var-missing: "{prefix} <gray>{target}.{name} no existía."
usage-reset: "{prefix} <green>{what} de <white>{rule}</white> reiniciado para <white>{target}</white>."
item-saved: "{prefix} <green>Ítem guardado como <white>{name}</white>. Úsalo con <yellow>give_item: saved:{name}</yellow>."
item-deleted: "{prefix} <yellow>Ítem <white>{name}</white> borrado."
item-missing: "{prefix} <gray>No hay un ítem llamado {name}."
import-done: "{prefix} <green>{events} eventos importados en <white>{folder}</white>; <yellow>{review}</yellow> acciones para revisar. Usa <yellow>/omni validate</yellow> y luego <yellow>/omni reload</yellow>."
test-none: "{prefix} <gray>No hay pruebas en las reglas. Agrega <yellow>tests:</yellow> a una regla (casos con <white>given</white> y <white>expect</white>; mira el README)."
test-rule-none: "{prefix} <gray>La regla <white>{rule}</white> no tiene pruebas. Ejemplo: <yellow>tests: [{given: {block.type: STONE}, expect: {fired: false}}]</yellow>"
test-summary-ok: "{prefix} <green>{total} pruebas: todas pasan</green><gray>{untested}</gray>"
test-summary-fail: "{prefix} <red>{total} pruebas: {failed} fallan</red><gray>, {passed} pasan{untested}</gray>"
selftest-ok: "{prefix} <green>Autoprueba superada ({passed}/{total})."
selftest-fail: "{prefix} <red>Autoprueba con fallas ({passed}/{total})."
# Paquetes (spec 011)
pack-enabled: "{prefix} <green>Paquete <white>{pack}</white> activado: {rules} reglas."
pack-disabled: "{prefix} <yellow>Paquete <white>{pack}</white> desactivado: {rules} reglas."
pack-note: "<gray>  El cambio dura hasta el próximo reload; para dejarlo fijo, pon enabled en su pack.yml."
pack-none: "{prefix} <gray>No hay paquetes. Un paquete es una carpeta de rules/ con un pack.yml (mira el README)."
