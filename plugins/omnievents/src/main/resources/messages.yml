# Mensajes de OmniEvents (MiniMessage). {prefix} se reemplaza por el prefijo.
prefix: "<dark_gray>[<gradient:#f7b733:#fc4a1a>Omni</gradient>]</dark_gray>"
no-permission: "{prefix} <red>No tienes permiso para esto."
unknown-subcommand: "{prefix} <red>Subcomando desconocido <white>{sub}</white>. Usa <yellow>/omni help</yellow>."
error: "{prefix} <red>{message}"
command-disabled: "{prefix} <red>Este comando está desactivado."
reload-done: "{prefix} <green>Recargado en {ms} ms: <white>{rules}</white> reglas, <red>{errors}</red> errores, <yellow>{warnings}</yellow> avisos."
validate-ok: "{prefix} <green>Todo en orden: 0 errores, <yellow>{warnings}</yellow> avisos."
validate-errors: "{prefix} <red>{errors} errores</red> y <yellow>{warnings} avisos</yellow>. Las reglas con errores no se cargan."
list-empty: "{prefix} <gray>No hay reglas que coincidan."
rule-enabled: "{prefix} <green>Regla <white>{rule}</white> activada."
rule-disabled: "{prefix} <yellow>Regla <white>{rule}</white> desactivada."
toggle-note: "<gray>  El cambio dura hasta el próximo reload; para dejarlo fijo, edita enabled en su archivo."
debug-on: "{prefix} <green>Depurando <white>{rule}</white>. Usa <yellow>/omni debug off</yellow> para parar."
debug-off: "{prefix} <gray>Depuración apagada."
debug-status: "{prefix} <gray>Depuración: <white>{rule}</white>"
call-done: "{prefix} <green>Regla <white>{rule}</white> ejecutada."
var-set: "{prefix} <green>{target}.{name}</green> <gray>=</gray> <white>{value}</white>"
var-deleted: "{prefix} <yellow>{target}.{name}</yellow> <gray>borrada."
var-missing: "{prefix} <gray>{target}.{name} no existía."
usage-reset: "{prefix} <green>{what} de <white>{rule}</white> reiniciado para <white>{target}</white>."
item-saved: "{prefix} <green>Ítem guardado como <white>{name}</white>. Úsalo con <yellow>give_item: saved:{name}</yellow>."
item-deleted: "{prefix} <yellow>Ítem <white>{name}</white> borrado."
item-missing: "{prefix} <gray>No hay un ítem llamado {name}."
import-done: "{prefix} <green>{events} eventos importados en <white>{folder}</white>; <yellow>{review}</yellow> acciones para revisar. Usa <yellow>/omni validate</yellow> y luego <yellow>/omni reload</yellow>."
selftest-ok: "{prefix} <green>Autoprueba superada ({passed}/{total})."
selftest-fail: "{prefix} <red>Autoprueba con fallas ({passed}/{total})."
