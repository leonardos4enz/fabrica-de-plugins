# yaml-language-server: $schema=https://raw.githubusercontent.com/leonardos4enz/fabrica-de-plugins/main/docs/omnievents/omnievents.schema.json
# Ejemplos de OmniEvents: bloques, variables por jugador, azar ponderado y enfriamientos.
# tests: casos de prueba de la regla; corren con /omni test y al cargar, sin tocar nada real (spec 010).

diamantes_contados:
  trigger: block_break
  worlds: [world]
  conditions:
    - "block.type in ['DIAMOND_ORE', 'DEEPSLATE_DIAMOND_ORE']"
    - "player.gamemode == 'survival'"
  actions:
    - set: "pvar.diamantes += 1"
    - if: "pvar.diamantes % 10 == 0"
      then:
        - broadcast: "<aqua>{player.name}</aqua> <gray>ya minó <aqua>{pvar.diamantes}</aqua> diamantes."
        - particle: TOTEM_OF_UNDYING;40;0.5;1;0.5;0.3
    - actionbar: "<aqua>Diamantes: {pvar.diamantes}"
  tests:
    - name: el décimo diamante se anuncia
      given: {player.name: Ana, player.gamemode: SURVIVAL, block.type: DIAMOND_ORE, pvar.diamantes: 9}
      expect:
        fired: true
        pvar.diamantes: 10
        messages: ["Ana ya minó 10 diamantes", "Diamantes: 10"]
        actions: ["particle: TOTEM"]
    - name: la piedra no cuenta
      given: {player.gamemode: SURVIVAL, block.type: STONE, pvar.diamantes: 3}
      expect: {fired: false, pvar.diamantes: 3}

# Paréntesis, ||, && y ! en una sola condición: imposible en una línea de ConditionalEvents.
bloque_protegido:
  trigger: block_break
  conditions: "block.type == 'BEDROCK' || (block.y < -60 && !player.hasPermission('omnievents.mineria.fondo'))"
  actions:
    - cancel
    - message: "<red>No puedes romper ese bloque aquí."
  tests:
    - given: {block.type: BEDROCK}
      expect: {fired: true, cancelled: true, messages: ["No puedes romper"]}
    - given: {block.type: STONE, block.y: 12}
      expect: {fired: false, cancelled: false}

suerte_minera:
  trigger: block_break
  conditions: "block.type ~= 'stone' && chance(2)"
  cooldown: 30s
  actions:
    - random:
        - weight: 70
          do:
            - give_item: IRON_INGOT;2
            - message: "<gray>¡Encontraste hierro escondido!"
        - weight: 25
          do:
            - give_item: GOLD_INGOT;1
            - message: "<gold>¡Una pepita de oro!"
        - weight: 5
          do:
            - give_item:
                material: DIAMOND
                name: "<aqua>Diamante de la suerte"
                lore: ["<gray>Minado por {player.name}"]
                glow: true
            - broadcast: "<aqua>{player.name}</aqua> <gray>encontró un diamante de la suerte."
