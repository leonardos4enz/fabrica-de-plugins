# yaml-language-server: $schema=https://raw.githubusercontent.com/leonardos4enz/fabrica-de-plugins/main/docs/omnievents/omnievents.schema.json
# Lo que llegó en la spec 014 para quien viene de ConditionalEvents: mensaje centrado, fuegos artificiales, reparar
# ítems y el permiso por regla para saltar el enfriamiento.

# /celebrar: un anuncio centrado y un fuego artificial sobre cada jugador. Una vez por hora; quien tenga el permiso
# omnievents.bypasscooldown.celebracion (dado con tu plugin de permisos) no espera.
celebracion:
  trigger: command
  command:
    name: celebrar
    description: Celebra con todo el servidor
  cooldown: 1h
  on_cooldown:
    - message: "<red>Podrás celebrar de nuevo en {var.cooldown_left} s."
  actions:
    - to: all
      centered_message: "<gold><b>¡FIESTA!</b>\n<gray>{source.name} invita a celebrar"
    - to: all
      firework: "colors:RED,#FFAA00,YELLOW type:STAR power:1 fade:WHITE trail:true"
  tests:
    - name: anuncia y lanza
      given: {player.name: Leo}
      expect:
        messages: ["¡FIESTA!"]
        actions: [centered_message, firework]

# Nadie puede llamar «Excalibur» a un ítem en el yunque.
nombre_reservado:
  trigger: item_repair
  conditions:
    - "repair_type == 'ANVIL' && lower(rename_text) contains 'excalibur'"
  actions:
    - cancel
    - message: "<red>Ese nombre está reservado."
  tests:
    - name: en el yunque se cancela
      given: {repair_type: ANVIL, rename_text: "La EXCALIBUR"}
      expect: {cancelled: true}
    - name: la afiladora no cuenta
      given: {repair_type: GRINDSTONE, rename_text: ""}
      expect: {fired: false}

# Spec 015: más de ConditionalEvents. Cada 100 saltos, un aviso en la barra de acción (player_statistic).
saltarin:
  trigger: player_statistic
  conditions:
    - "statistic == 'JUMP' && new_value % 100 == 0"
  actions:
    - actionbar: "<aqua>¡{new_value} saltos!"
  tests:
    - name: cada cien
      given: {statistic: JUMP, previous_value: 199, new_value: 200}
      expect: {messages: ["¡200 saltos!"]}
    - name: los demás no
      given: {statistic: JUMP, previous_value: 200, new_value: 201}
      expect: {fired: false}

# Sugerencias propias para /warp (si tu servidor tiene ese comando): tab_complete cambia lo que ve el jugador al
# apretar Tab.
warp_sugerencias:
  trigger: player_tab_complete
  conditions:
    - "cmd.name == 'warp' && args.size <= 1"
  actions:
    - tab_complete: "set;spawn,tienda,arena"
  tests:
    - given: {cmd: {name: warp}, args: [""], last: ""}
      expect: {actions: [tab_complete]}

# /reglas: un mensaje con clic escrito en JSON, como el json_message de ConditionalEvents.
enlace_reglas:
  trigger: command
  command:
    name: reglas
    description: Muestra las reglas del servidor
  actions:
    - json_message: '{"text":"» Lee las reglas, {player.name}","color":"gold","hoverEvent":{"action":"show_text","contents":"Clic para abrirlas"},"clickEvent":{"action":"run_command","value":"/help"}}'
  tests:
    - given: {player.name: Leo}
      expect: {messages: ["» Lee las reglas, Leo"]}

# Spec 016: los detalles que faltaban. /anunciar <texto>: el texto queda 6 s en la barra de acción de todos (como el
# «texto;ticks» de ConditionalEvents), visión nocturna sin ícono y un cohete que sale en ángulo (shot_direction).
# slice(args, 0, 8) toma hasta 8 palabras, como %args_substring_1-8%.
anuncio_barra:
  trigger: command
  command:
    name: anunciar
    description: Anuncia un texto en la barra de acción
    permission: omnievents.ejemplo.anuncio
  conditions:
    - "args.size >= 1"
  actions:
    - to: all
      actionbar: "<gold>» {join(slice(args, 0, 8), ' ')};120"
    - effect: "NIGHT_VISION;30;1;false;false"
    - firework: "colors:YELLOW,WHITE type:BALL power:0 shot_direction:-0.3,0.3;1,1;-0.3,0.3;0.5-0.8"
  else:
    - message: "<red>Uso: /anunciar <texto>"
  tests:
    - name: ocho palabras como mucho
      given: {args: [a, b, c, d, e, f, g, h, i]}
      expect:
        messages: ["» a b c d e f g h"]
        actions: [actionbar, effect, firework]
    - name: sin texto
      given: {args: []}
      expect: {messages: ["Uso: /anunciar"]}
