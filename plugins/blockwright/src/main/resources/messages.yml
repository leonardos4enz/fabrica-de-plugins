# Blockwright messages (MiniMessage). {name} values are filled in by the plugin and never read as tags.
prefix: "<gold>Blockwright</gold> <dark_gray>»</dark_gray> "

no-permission: "{prefix}<red>You don't have permission to do that."
players-only: "{prefix}<red>Only a player can do that."
unknown-command: "{prefix}<red>Unknown command '{input}'{hint}. <gray>See /bwr help"
usage: "{prefix}<red>Usage: <white>{usage}"
error: "{prefix}<red>{message}"
unknown-world: "{prefix}<red>There is no world called '{world}'."
unknown-direction: "{prefix}<red>'{input}' is not a direction{hint}: up, down, north, south, east or west."

help-header: "<gold>Blockwright</gold> <gray>- /bwr help <command> shows an example"
help-line: " <yellow>{usage}</yellow> <dark_gray>-</dark_gray> <gray>{text}"
help-footer: "<gray>Patterns: <white>stone</white>, <white>70% stone, 30% andesite</white>, <white>oak_stairs[facing=north]</white>, <white>$preset</white>. Masks: <white>dirt, grass_block</white>, <white>*_wool</white>, <white>#logs</white>, <white>!air</white>."
help-detail: "<yellow>{usage}</yellow>\n<gray>{text}\n<gray>Example: <white>{example}"

help:
  help: { usage: "/bwr help [command]", text: "This list, or the details of one command.", example: "/bwr help replace" }
  wand: { usage: "/bwr wand", text: "Get the selection wand: left click a block for corner 1, right click for corner 2.", example: "/bwr wand" }
  pos1: { usage: "/bwr pos1 [x y z] [--world <w>]", text: "Corner 1 where you stand, or at those coordinates (~ is relative).", example: "/bwr pos1 ~ ~-1 ~" }
  pos2: { usage: "/bwr pos2 [x y z] [--world <w>]", text: "Corner 2 where you stand, or at those coordinates.", example: "/bwr pos2 120 64 -30" }
  sel: { usage: "/bwr sel [clear|show|hide]", text: "Size of your selection; clear it; show or hide its outline.", example: "/bwr sel" }
  expand: { usage: "/bwr expand <blocks> [direction] | vert", text: "Grow the selection where you look (or up, down, north...); vert = whole height.", example: "/bwr expand 10 up" }
  contract: { usage: "/bwr contract <blocks> [direction]", text: "Shrink the selection from that side.", example: "/bwr contract 2 north" }
  shift: { usage: "/bwr shift <blocks> [direction]", text: "Move the selection without changing its size.", example: "/bwr shift 5 east" }
  set: { usage: "/bwr set <pattern> [--preview]", text: "Fill the selection.", example: "/bwr set 70% stone, 30% andesite" }
  replace: { usage: "/bwr replace <mask> with <pattern> [--preview]", text: "Change only the blocks that match the mask.", example: "/bwr replace dirt, grass_block with stone" }
  walls: { usage: "/bwr walls <pattern> [--preview]", text: "The four side walls of the selection.", example: "/bwr walls stone_bricks" }
  faces: { usage: "/bwr faces <pattern> [--preview]", text: "Walls, floor and roof: a hollow box.", example: "/bwr faces glass" }
  copy: { usage: "/bwr copy", text: "Copy the selection, relative to where you stand.", example: "/bwr copy" }
  cut: { usage: "/bwr cut [--preview]", text: "Copy the selection and leave air.", example: "/bwr cut" }
  paste: { usage: "/bwr paste [--air] [--preview]", text: "Paste what you copied, relative to where you stand. Copied air is skipped unless --air.", example: "/bwr paste --preview" }
  rotate: { usage: "/bwr rotate <90|180|270|-90>", text: "Turn what you copied (clockwise seen from above), stairs and logs included.", example: "/bwr rotate 90" }
  flip: { usage: "/bwr flip [direction]", text: "Mirror what you copied towards where you look (or a direction).", example: "/bwr flip up" }
  undo: { usage: "/bwr undo [count] [--player <name>]", text: "Undo your last edits, also after a restart. Blocks someone changed since are left alone.", example: "/bwr undo 3" }
  redo: { usage: "/bwr redo [count] [--player <name>]", text: "Redo what you undid.", example: "/bwr redo" }
  history: { usage: "/bwr history [player]", text: "Your last edits (or another player's).", example: "/bwr history" }
  confirm: { usage: "/bwr confirm", text: "Run the edit that is waiting (a big one, or a preview).", example: "/bwr confirm" }
  cancel: { usage: "/bwr cancel", text: "Drop the waiting edit or its preview, or stop your running edits.", example: "/bwr cancel" }
  jobs: { usage: "/bwr jobs [cancel <id>]", text: "Running edits, their progress and the plugin's time per tick.", example: "/bwr jobs" }
  limits: { usage: "/bwr limits", text: "Your limits: biggest edit, edits at once, worlds, blocked blocks.", example: "/bwr limits" }
  reload: { usage: "/bwr reload", text: "Reload config.yml, messages.yml and presets.yml.", example: "/bwr reload" }
  validate: { usage: "/bwr validate", text: "List the problems in the configuration.", example: "/bwr validate" }
  selftest: { usage: "/bwr selftest", text: "Edit, undo, redo and undo a small box near spawn and check every step.", example: "/bwr selftest" }

wand-given: "{prefix}<green>Here is your wand: <white>left click</white> a block for corner 1, <white>right click</white> for corner 2."
corner-set: "{prefix}Corner {which} at <white>{pos}</white>."
corner-set-size: "{prefix}Corner {which} at <white>{pos}</white> <dark_gray>·</dark_gray> selection <white>{size}</white> ({blocks} blocks)."
no-selection: "{prefix}<red>Select two corners first: /bwr wand, or /bwr pos1 and /bwr pos2."
sel-info: "{prefix}Selection <white>{size}</white> ({blocks} blocks) in {world}, from {from} to {to}."
sel-cleared: "{prefix}Selection cleared."
sel-shown: "{prefix}The outline is shown while you hold the wand."
sel-hidden: "{prefix}The outline is hidden."
sel-changed: "{prefix}Selection now <white>{size}</white> ({blocks} blocks)."
sel-empty: "{prefix}<red>That would leave the selection empty."
sel-outside: "{prefix}<red>That is outside the world's height."

limit-world: "{prefix}<red>You may not edit in {world}."
limit-blocks: "{prefix}<red>That is {blocks} blocks; your limit is {max} (groups: {groups}). Select less, or ask for a bigger group."
limit-blocked: "{prefix}<red>You may not place {block} (blocked for your group: see /bwr limits)."
limit-jobs: "{prefix}<red>You already have {max} edit(s) running or waiting. Wait, or /bwr cancel."

confirm-needed: "{prefix}<yellow>This {kind} changes up to <white>{blocks}</white> blocks (about {time}). <white>/bwr confirm</white> to go ahead, or run it again with <white>--preview</white> to see it first. It waits {seconds} s."
preview-start: "{prefix}Preparing a preview of {kind} ({blocks} blocks): only you will see it."
preview-ready: "{prefix}<aqua>Preview ready: {shown} blocks change. Nothing changed yet. <white>/bwr confirm</white> to do it, <white>/bwr cancel</white> to drop it ({seconds} s)."
preview-partial: "{prefix}<aqua>Preview shows the first {shown} blocks of {blocks}. Nothing changed yet. <white>/bwr confirm</white> to do it, <white>/bwr cancel</white> to drop it ({seconds} s)."
nothing-to-confirm: "{prefix}<red>There is nothing waiting for confirmation."
pending-cancelled: "{prefix}Dropped: nothing was changed."
pending-expired: "{prefix}<gray>The edit waiting for confirmation expired: nothing was changed."
nothing-to-cancel: "{prefix}<red>You have nothing running or waiting."
jobs-cancelled: "{prefix}Stopped {count} edit(s): what was already done can be undone with /bwr undo."

edit-start: "{prefix}Started {kind}: {blocks} blocks, about {time}."
edit-queued: "{prefix}{kind} is waiting for your previous edit to finish."
edit-done: "{prefix}<green>Done: {kind} changed {changed} blocks in {time}.</green> <gray>/bwr undo to undo it (#{id})."
edit-cancelled: "{prefix}<yellow>{kind} stopped after {changed} blocks: /bwr undo removes them."
progress: "<gold>{kind}</gold> <white>{percent}%</white> <gray>· {done} of {total} blocks"

copied: "{prefix}<green>Copied {size} ({blocks} blocks).</green> <gray>/bwr paste puts it relative to where you stand."
copy-cancelled: "{prefix}<yellow>The copy stopped before the end: the clipboard did not change."
no-clipboard: "{prefix}<red>Your clipboard is empty: /bwr copy first."
rotated: "{prefix}Clipboard turned {degrees}°: now {size}."
rotate-90: "{prefix}<red>Turn in steps of 90: 90, 180, 270 or -90."
flipped: "{prefix}Clipboard flipped {direction}."

undo-done: "{prefix}<green>Undone #{id} ({kind} {detail}): {changed} blocks back as they were."
redo-done: "{prefix}<green>Redone #{id} ({kind} {detail}): {changed} blocks."
undo-skipped: "{prefix}<yellow>{skipped} block(s) were left alone: someone changed them after the edit."
undo-cancelled: "{prefix}<yellow>Undo of #{id} stopped before the end: run it again to finish."
undo-busy: "{prefix}<red>Wait for your running edit to finish (or /bwr cancel) before undoing."
undo-no-world: "{prefix}<red>Edit #{id} was in {world}, which is not loaded."
nothing-to-undo: "{prefix}<red>{player} has nothing to undo."
nothing-to-redo: "{prefix}<red>{player} has nothing to redo."
no-history: "{prefix}<red>No history for {player}{hint}."
history-empty: "{prefix}{player} has no edits in the history."
history-header: "{prefix}Last edits of {player} ({count}):"
history-line: " <white>#{id}</white> <gray>{when}</gray> {kind} <gray>{detail}</gray> · {changed} blocks in {world} <dark_gray>({state})"

jobs-header: "{prefix}{count} edit(s). Plugin time per tick: last {last} ms, max {max} ms (budget {budget} ms)."
jobs-last: "{prefix}Last edit: {kind}, {changed} blocks, longest tick {longest} ms (budget {budget} ms)."
jobs-line: " <white>#{id}</white> {kind} by {owner}: {percent}% <dark_gray>({state})"
job-cancelled: "{prefix}Edit #{id} stopped."
no-such-job: "{prefix}<red>There is no running edit #{id}."
limits: "{prefix}Groups: <white>{groups}</white> · biggest edit {max} blocks · {jobs} at once · worlds: {worlds} · blocked: {blocked}"

reloaded: "{prefix}Reloaded: {errors} error(s), {warnings} warning(s). /bwr validate lists them."
validate-ok: "{prefix}<green>Configuration OK."
validate-error: "<red>✘ {issue}"
validate-warning: "<yellow>• {issue}"
selftest-start: "{prefix}Selftest in a 6×6×6 box at {box}..."
selftest-ok: "{prefix}<green>Selftest passed: set {changed} blocks, undo, redo and undo; the terrain is as before."
selftest-failed: "{prefix}<red>Selftest failed: {reason}"
